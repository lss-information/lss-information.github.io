name: Sync Missionchief Data

on:
  push:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================
      # NL DATA
      # =====================
      - name: Download NL data
        run: |
          mkdir -p gameversions/nl_NL/nl_NL-Data
          curl -f -sSL https://raw.githubusercontent.com/LSS-Data/LSS-Data/refs/heads/main/nl_NL/Vehicles.json \
            -o gameversions/nl_NL/nl_NL-Data/Vehicles.json
          curl -f -sSL https://raw.githubusercontent.com/LSS-Data/LSS-Data/refs/heads/main/nl_NL/buildings.json \
            -o gameversions/nl_NL/nl_NL-Data/buildings.json
          curl -f -sSL https://raw.githubusercontent.com/LSS-Data/LSS-Data/refs/heads/main/nl_NL/pois.json \
            -o gameversions/nl_NL/nl_NL-Data/pois.json

      # =====================
      # US DATA
      # =====================
      - name: Download US data
        run: |
          mkdir -p gameversions/en_US/en_US-Data
          curl -f -sSL https://raw.githubusercontent.com/LSS-Data/LSS-Data/refs/heads/main/en_US/vehicles.json \
            -o gameversions/en_US/en_US-Data/vehicles.json
          curl -f -sSL https://raw.githubusercontent.com/LSS-Data/LSS-Data/refs/heads/main/en_US/buildings.json \
            -o gameversions/en_US/en_US-Data/buildings.json
          curl -f -sSL https://raw.githubusercontent.com/LSS-Data/LSS-Data/refs/heads/main/en_US/pois.json \
            -o gameversions/en_US/en_US-Data/pois.json
            
            
       # =====================
      # US DATA
      # =====================
      - name: Download UK data
        run: |
          mkdir -p gameversions/en_US/en_US-Data
          curl -f -sSL https://raw.githubusercontent.com/LSS-Data/LSS-Data/refs/heads/main/en_GB/vehicles.json \
            -o gameversions/en_UK/en_UK-Data/vehicles.json
          curl -f -sSL https://raw.githubusercontent.com/LSS-Data/LSS-Data/refs/heads/main/en_UB/buildings.json \
            -o gameversions/en_UK/en_UK-Data/buildings.json
          curl -f -sSL https://raw.githubusercontent.com/LSS-Data/LSS-Data/refs/heads/main/en_GB/pois.json \
            -o gameversions/en_UK/en_UK-Data/pois.json

      # =====================
      # CHECK FOR CHANGES
      # =====================
      - name: Detect changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # =====================
      # UPDATE TIMESTAMPS (ONLY IF CHANGED)
      # =====================
      - name: Update NL timestamp
        if: steps.changes.outputs.changed == 'true'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > gameversions/nl_NL/nl_NL-Data/last_update.txt

      - name: Update US timestamp
        if: steps.changes.outputs.changed == 'true'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > gameversions/en_US/en_US-Data/last_update.txt

      # =====================
      # COMMIT (ONLY IF CHANGED)
      # =====================
      - name: Commit if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add gameversions/
          git commit -m "Sync game data"
          git push origin main
