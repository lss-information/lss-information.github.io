<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.4, maximum-scale=1.0">
<title>Selecteer spelversie</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
/* BASE */
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28;
    color: #dddddd;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    text-align: center;
}

/* HEADER & FOOTER */
header, footer {
    background-color: #2a2a3a;
    padding: 20px;
    border-bottom: 2px solid #555566;
}

footer {
    border-top: 2px solid #555566;
    margin-top: auto;
    font-size: 12px;
    color: #aaaaaa;
}

/* TITLES */
h1 {
    margin: 10px 0;
    font-size: 32px;
    color: #eeeeee;
}

h2 {
    margin: 10px 0 20px 0;
    font-size: 18px;
    color: #cccccc;
}

/* LANGUAGE SELECTOR */
.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
}

.language-selector img {
    height: 24px;
    width: auto;
    cursor: pointer;
    border: 2px solid #555566;
    border-radius: 4px;
    transition: transform 0.2s;
}

.language-selector img:hover {
    transform: scale(1.1);
}

/* MAIN */
main {
    padding: 50px 20px;
}

/* CARD / NEON-BOX */
.neon-box {
    background-color: #2a2a3a;
    border: 2px solid #555566;
    border-radius: 18px;
    padding: 45px 40px;
    max-width: 850px;
    margin: 0 auto;
}

/* BUTTONS */
.button-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.button, .back-button {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 2px solid #555566;
    padding: 18px 26px;
    margin: 12px 0;
    border-radius: 10px;
    text-decoration: none;
    font-size: 18px;
    font-weight: 500;
    width: 100%;
    max-width: 460px;
    transition: background-color 0.2s, transform 0.2s, color 0.2s;
}

.button:hover, .back-button:hover {
    background-color: #444456;
    color: #ffffff;
    transform: scale(1.05);
}

/* SHAPES / NEON EFFECT */
.shape-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
}

.shape-bg div {
    position: absolute;
    border: 2px solid #55556655;
    border-radius: 50%;
    animation: float 20s infinite linear;
}

.shape1 { width: 200px; height: 200px; top: 10%; left: 10%; }
.shape2 { width: 300px; height: 300px; bottom: 10%; right: 15%; }

@keyframes float {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
}

/* ===== MOBILE FIX ===== */
@media (max-width: 600px) {
    body { min-height: auto; }
    main { padding: 20px 10px; }
    .neon-box { padding: 25px 20px; }
    footer { margin-top: 20px; }
    .button, .back-button { font-size: 16px; padding: 14px 24px; }
}
</style>
</head>

<body>

<header>
    <h1 id="page-title">Selecteer spelversie</h1>
</header>

<ul class="language-selector">
    <li><img src="../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')" /></li>
    <li><img src="../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')" /></li>
    <li><img src="../images/flag_uk.gif" alt="English (UK)" onclick="changeLanguage('en-uk')" /></li>
    <li><img src="../images/flag_us.gif" alt="English (US)" onclick="changeLanguage('en-us')" /></li>
    <li><img src="../images/flag_au.gif" alt="English (AU)" onclick="changeLanguage('en-au')" /></li>
    <li><a class="back-button" id="back-button" href="../index">Terug</a></li>
</ul>

<main>
    <div class="shape-bg">
        <div class="shape1"></div>
        <div class="shape2"></div>
    </div>

    <div class="neon-box">
        <h2 id="welcome-message">Selecteer hieronder een knop om naar de overzichten te gaan.</h2>
        <div class="button-container">
            <a class="button" id="button-nl" href="nl_NL/indexNL">Meldkamerspel (NL)</a>
            <a class="button" id="button-de" href="de_DE/indexDE">Leitstellenspiel (DE)</a>
            <a class="button" id="button-uk" href="en_UK/indexUK">Missionchief (UK)</a>
            <a class="button" id="button-us" href="en_US/indexUS">Missionchief (US)</a>
            <a class="button" id="button-us" href="en_US/indexAU">Missionchief (AU)</a>
        </div>
    </div>
</main>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
// Dynamisch jaartal
const startYear = 2024;
const currentYear = new Date().getFullYear();
document.getElementById('footer-year').textContent = startYear === currentYear ? `${currentYear}` : `${startYear} - ${currentYear}`;

// Taalwissel functies
function changeLanguage(lang) {
    let pageTitle = '';
    let welcomeMessage = '';
    let backText = '';

    switch(lang) {
        case "nl":
            pageTitle = "Selecteer spelversie";
            welcomeMessage = "Selecteer hieronder een knop om naar de overzichten te gaan.";
            backText = "Terug";
            break;
        case "de":
            pageTitle = "Wählen Sie Spielversion";
            welcomeMessage = "Wählen Sie unten einen Knopf, um zu den Übersichten zu gelangen.";
            backText = "Zurück";
            break;
        case "en-uk":
            pageTitle = "Select Game Version";
            welcomeMessage = "Select a button below to go to the overviews.";
            backText = "Back";
            break;
        case "en-us":
            pageTitle = "Select Game Version";
            welcomeMessage = "Select a button below to go to the overviews.";
            backText = "Back";
            break;
        case "en-au":
            pageTitle = "Select Game Version";
            welcomeMessage = "Select a button below to go to the overviews.";
            backText = "Back";
            break;
        default:
            pageTitle = "Selecteer spelversie";
            welcomeMessage = "Selecteer hieronder een knop om naar de overzichten te gaan.";
            backText = "Terug";
    }

    document.title = pageTitle;
    document.getElementById('page-title').textContent = pageTitle;
    document.getElementById('welcome-message').textContent = welcomeMessage;
    document.getElementById('back-button').textContent = backText;
}

// Init default language
document.addEventListener("DOMContentLoaded", () => {
    changeLanguage("nl");
});
</script>

</body>
</html>
