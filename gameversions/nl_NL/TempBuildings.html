<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.4, maximum-scale=1.0">
<title>Gebouwen Meldkamerspel (NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Roboto', sans-serif;
    background-color: #1e1e28;
    color: #dddddd;
    text-align: center;
    line-height: 1.5;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    margin: 30px 0 10px;
    font-size: 32px;
    color: #eeeeee;
    text-shadow: 0 0 5px rgba(0,0,0,0.5);
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
    color: #cccccc;
}

#last-update {
    font-size: 13px;
    color: #aaaaaa;
}

.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
    width: 100%;
}

.language-selector img {
    height: 24px;
    width: auto;
    cursor: pointer;
    transition: transform 0.2s, border 0.2s;
    border: 2px solid #555566;
    border-radius: 4px;
}

.language-selector img:hover {
    transform: scale(1.1);
}

.button {
    font-family: 'Orbitron', sans-serif;
    background-color: #2c2c3c;
    color: #dddddd;
    border: 2px solid #555566;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.2s, transform 0.2s, color 0.2s;
    font-size: 12px;
}

.button:hover {
    background-color: #444456;
    color: #ffffff;
    transform: scale(1.05);
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 95%;
    min-width: 700px;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #2a2a3a;
    border-radius: 10px;
}

thead th {
    background-color: #3a3a4a;
    padding: 12px;
    border-bottom: 2px solid #555566;
    color: #eeeeee;
}

tbody td {
    padding: 10px;
    border-bottom: 1px solid #444455;
    color: #dddddd;
    font-family: 'Roboto', sans-serif;
    font-size: 14px;
    vertical-align: top;
}

tbody tr:hover {
    background-color: #3c3c4c;
}

.button-toggle {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 1px solid #555566;
    padding: 6px 16px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    margin-right: 5px;
    font-family: 'Orbitron', sans-serif;
}

.actions-cell {
    position: relative; /* container voor absolute dropdowns */
    vertical-align: top;
    padding: 8px;
}

/* Dropdowns absolute */
.extensions-content, .vehicles-content {
    position: absolute;
    left: 0;
    top: 100%;
    background-color: #262632;
    padding: 6px 8px;
    border-radius: 4px;
    width: 300px;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease;
    font-family: 'Roboto', sans-serif;
    font-size: 13px;
    line-height: 1.5;
}

.extensions-content.show, .vehicles-content.show {
    max-height: 500px;
    opacity: 1;
}

#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #888888;
}
</style>
</head>

<body>

<ul class="language-selector">
    <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')"></li>
    <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')"></li>
    <li><img src="../../images/flag_uk.gif" alt="English" onclick="changeLanguage('en')"></li>

    <li><a class="button" id="game-button" href="/index">Startpagina</a></li>
    <li><a class="button" id="contact-button" href="/gameversions/contact">Contact</a></li>
    <li><a class="button" id="back-button" href="/gameversions/nl_NL/indexNL">Terug</a></li>
</ul>

<h1 id="page-title"></h1>
<p id="page-message"></p>
<p id="last-update"></p>

<div class="table-wrapper">
    <div id="sheet-data"></div>
</div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const buildingsFile = 'nl_NL-Data/buildings.json';
const vehiclesFile = 'nl_NL-Data/Vehicles.json';
const lastUpdateFile = 'nl_NL-Data/last_update_buildings.txt';

const pageTranslations = {
    nl: {
        title: "Gebouwen",
        message: "Overzicht van alle gebouwen in Meldkamerspel (NL).",
        gameButton: "Startpagina",
        contactButton: "Contact",
        backButton: "Terug",
        lastUpdate: "Laatste update",
        tableHeaders: ["ID", "Gebouwnaam", "Credits", "Acties"],
        toggleExtensions: { show: "Toon Uitbreidingen", hide: "Verberg Uitbreidingen" },
        toggleVehicles: { show: "Toon Voertuigen", hide: "Verberg Voertuigen" }
    },
    de: {
        title: "Gebäude",
        message: "Übersicht aller Gebäude (NL).",
        gameButton: "Startseite",
        contactButton: "Kontakt",
        backButton: "Zurück",
        lastUpdate: "Letzte Aktualisierung",
        tableHeaders: ["ID", "Gebäude", "Credits", "Aktionen"],
        toggleExtensions: { show: "Erweiterungen anzeigen", hide: "Erweiterungen verbergen" },
        toggleVehicles: { show: "Fahrzeuge anzeigen", hide: "Fahrzeuge verbergen" }
    },
    en: {
        title: "Buildings",
        message: "Overview of all buildings (NL).",
        gameButton: "Homepage",
        contactButton: "Contact",
        backButton: "Back",
        lastUpdate: "Last update",
        tableHeaders: ["ID", "Building Name", "Credits", "Actions"],
        toggleExtensions: { show: "Show Extensions", hide: "Hide Extensions" },
        toggleVehicles: { show: "Show Vehicles", hide: "Hide Vehicles" }
    }
};

let currentLang = 'nl';

function changeLanguage(lang) {
    currentLang = lang;
    const t = pageTranslations[lang];

    document.title = t.title;
    document.getElementById('page-title').textContent = t.title;
    document.getElementById('page-message').textContent = t.message;
    document.getElementById('game-button').textContent = t.gameButton;
    document.getElementById('contact-button').textContent = t.contactButton;
    document.getElementById('back-button').textContent = t.backButton;

    const startYear = 2024;
    const currentYear = new Date().getFullYear();
    document.getElementById('footer-year').textContent =
        startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

    loadLastUpdate();
    initBuildings();
}

async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const date = new Date((await res.text()).trim());
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: ${date.toLocaleString()}`;
    } catch {
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: onbekend`;
    }
}

async function initBuildings() {
    const buildings = await (await fetch(buildingsFile)).json();
    const vehicles = await (await fetch(vehiclesFile)).json();

    const container = document.getElementById('sheet-data');
    container.innerHTML = '';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');

    pageTranslations[currentLang].tableHeaders.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        tr.appendChild(th);
    });

    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    Object.keys(buildings).forEach(key => {
        const b = buildings[key];
        const hasExtensions = b.extensions && b.extensions.length > 0;
        const hasVehicles = Object.values(vehicles).some(v => (v.possibleBuildings || []).includes(Number(key)));

        const row = document.createElement('tr');
        const actionCell = document.createElement('td');
        actionCell.className = 'actions-cell';

        // Buttons
        if (hasExtensions) {
            const extBtn = document.createElement('button');
            extBtn.className = 'button-toggle ext-btn';
            extBtn.textContent = pageTranslations[currentLang].toggleExtensions.show;
            actionCell.appendChild(extBtn);
        }
        if (hasVehicles) {
            const vehBtn = document.createElement('button');
            vehBtn.className = 'button-toggle veh-btn';
            vehBtn.textContent = pageTranslations[currentLang].toggleVehicles.show;
            actionCell.appendChild(vehBtn);
        }

        // Dropdowns
        if (hasExtensions) {
            const extDiv = document.createElement('div');
            extDiv.className = 'extensions-content';
            (b.extensions || []).forEach(ext => {
                if (!ext) return;
                const vehicleNames = (ext?.unlocksVehicleTypes || [])
                    .map(vID => vehicles[vID]?.caption || vID)
                    .join(', ');

                extDiv.innerHTML += `<strong>${ext.caption}</strong><br>
                                     Credits: ${ext.credits}<br>
                                     Bouwduur: ${ext.duration}<br>
                                     Voertuigen: ${vehicleNames || 'Geen'}<br><br>`;
            });
            actionCell.appendChild(extDiv);

            const extBtn = actionCell.querySelector('.ext-btn');
            extBtn.onclick = () => {
                const open = extDiv.classList.toggle('show');
                extDiv.style.maxHeight = open ? extDiv.scrollHeight + 'px' : null;
                extBtn.textContent = open
                    ? pageTranslations[currentLang].toggleExtensions.hide
                    : pageTranslations[currentLang].toggleExtensions.show;
            };
        }

        if (hasVehicles) {
            const vehDiv = document.createElement('div');
            vehDiv.className = 'vehicles-content';
            Object.keys(vehicles).forEach(vID => {
                const v = vehicles[vID];
                if ((v.possibleBuildings || []).includes(Number(key))) {
                    vehDiv.innerHTML += `<strong>${v.caption}</strong><br>
                                         Credits: ${v.credits}<br>
                                         Personeel: ${v.staff?.min || 0} - ${v.staff?.max || 0}<br><br>`;
                }
            });
            actionCell.appendChild(vehDiv);

            const vehBtn = actionCell.querySelector('.veh-btn');
            vehBtn.onclick = () => {
                const open = vehDiv.classList.toggle('show');
                vehDiv.style.maxHeight = open ? vehDiv.scrollHeight + 'px' : null;
                vehBtn.textContent = open
                    ? pageTranslations[currentLang].toggleVehicles.hide
                    : pageTranslations[currentLang].toggleVehicles.show;
            };
        }

        row.innerHTML = `<td>${key}</td><td>${b.caption}</td><td>${b.credits}</td>`;
        row.appendChild(actionCell);
        tbody.appendChild(row);
    });

    table.appendChild(tbody);
    container.appendChild(table);
}

window.addEventListener('DOMContentLoaded', () => {
    changeLanguage(currentLang);
});
</script>

</body>
</html>
