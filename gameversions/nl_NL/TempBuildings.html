<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.4, maximum-scale=1.0">
<title>Gebouwen Meldkamerspel (NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28;
    color: #dddddd;
    text-align: center;
}

/* Language selector */
.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
    width: 100%;
}

.language-selector img {
    height: 24px;
    width: auto;
    cursor: pointer;
    transition: transform 0.2s, border 0.2s;
    border: 2px solid #555566;
    border-radius: 4px;
}

.language-selector img:hover {
    transform: scale(1.1);
}

/* Buttons */
.button {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 2px solid #555566;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.2s, transform 0.2s, color 0.2s;
    font-size: 12px;
}

.button:hover {
    background-color: #444456;
    color: #ffffff;
    transform: scale(1.05);
}

/* Titles */
h1 {
    margin: 30px 0 10px;
    font-size: 32px;
    color: #eeeeee;
    text-shadow: 0 0 5px rgba(0,0,0,0.5);
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
    color: #cccccc;
}

#last-update {
    font-size: 13px;
    color: #aaaaaa;
}

/* Table */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 95%;
    min-width: 700px;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #2a2a3a;
    border-radius: 10px;
}

thead th {
    background-color: #3a3a4a;
    padding: 12px;
    border-bottom: 2px solid #555566;
    color: #eeeeee;
}

tbody td {
    padding: 10px;
    border-bottom: 1px solid #444455;
    color: #dddddd;
}

tbody tr:hover {
    background-color: #3c3c4c;
}

/* Extensions */
.button-toggle {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 1px solid #555566;
    padding: 6px 16px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
}

.extensions-row td {
    background-color: #262632;
    text-align: left;
    font-size: 14px;
    color: #cccccc;
}

.extensions-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease;
}

.extensions-content.show {
    opacity: 1;
}

/* Footer */
#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #888888;
}
</style>
</head>

<body>

<ul class="language-selector">
    <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')"></li>
    <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')"></li>
    <li><img src="../../images/flag_uk.gif" alt="English" onclick="changeLanguage('en')"></li>

    <li><a class="button" id="game-button" href="/index">Startpagina</a></li>
    <li><a class="button" id="contact-button" href="/gameversions/contact">Contact</a></li>
    <li><a class="button" id="back-button" href="/gameversions/nl_NL/indexNL">Terug</a></li>
</ul>

<h1 id="page-title"></h1>
<p id="page-message"></p>
<p id="last-update"></p>

<div class="table-wrapper">
    <div id="sheet-data"></div>
</div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const buildingsFile = 'nl_NL-Data/buildings.json';
const vehiclesFile = 'nl_NL-Data/Vehicles.json';
const translationsFile = 'translations.json';
const lastUpdateFile = 'nl_NL-Data/last_update.txt';

const pageTranslations = {
    nl: {
        title: "Gebouwen",
        message: "Overzicht van alle gebouwen in Meldkamerspel (NL).",
        gameButton: "Startpagina",
        contactButton: "Contact",
        backButton: "Terug",
        lastUpdate: "Laatste update",
        tableHeaders: ["ID", "Gebouwnaam", "Credits", "Uitbreidingen"],
        toggle: { show: "Toon Uitbreidingen", hide: "Verberg Uitbreidingen" }
    },
    de: {
        title: "Gebäude",
        message: "Übersicht aller Gebäude (NL).",
        gameButton: "Startseite",
        contactButton: "Kontakt",
        backButton: "Zurück",
        lastUpdate: "Letzte Aktualisierung",
        tableHeaders: ["ID", "Gebäude", "Credits", "Erweiterungen"],
        toggle: { show: "Erweiterungen anzeigen", hide: "Erweiterungen verbergen" }
    },
    en: {
        title: "Buildings",
        message: "Overview of all buildings (NL).",
        gameButton: "Homepage",
        contactButton: "Contact",
        backButton: "Back",
        lastUpdate: "Last update",
        tableHeaders: ["ID", "Building Name", "Credits", "Extensions"],
        toggle: { show: "Show Extensions", hide: "Hide Extensions" }
    }
};

let currentLang = 'nl';

function changeLanguage(lang) {
    currentLang = lang;
    const t = pageTranslations[lang];

    document.title = t.title;
    document.getElementById('page-title').textContent = t.title;
    document.getElementById('page-message').textContent = t.message;
    document.getElementById('game-button').textContent = t.gameButton;
    document.getElementById('contact-button').textContent = t.contactButton;
    document.getElementById('back-button').textContent = t.backButton;

    const startYear = 2024;
    const currentYear = new Date().getFullYear();
    document.getElementById('footer-year').textContent =
        startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

    loadLastUpdate();
    initBuildings();
}

async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const date = new Date((await res.text()).trim());
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: ${date.toLocaleString()}`;
    } catch {
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: onbekend`;
    }
}

async function initBuildings() {
    const buildings = await (await fetch(buildingsFile)).json();
    const vehicles = await (await fetch(vehiclesFile)).json();

    const container = document.getElementById('sheet-data');
    container.innerHTML = '';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');

    pageTranslations[currentLang].tableHeaders.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        tr.appendChild(th);
    });

    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    Object.keys(buildings).forEach(key => {
        const b = buildings[key];
        const hasExtensions = b.extensions && b.extensions.length > 0;

        // Hoofdrij
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${key}</td>
            <td>${b.caption}</td>
            <td>${b.credits}</td>
            <td>${hasExtensions ? `<button class="button-toggle">${pageTranslations[currentLang].toggle.show}</button>` : ''}</td>
        `;
        tbody.appendChild(row);

        // Extensions dropdown alleen als aanwezig
        if (hasExtensions) {
            const extRow = document.createElement('tr');
            extRow.className = 'extensions-row';
            const td = document.createElement('td');
            td.colSpan = 4;

            const div = document.createElement('div');
            div.className = 'extensions-content';

            b.extensions.forEach(ext => {
                const vehicleNames = (ext.unlocksVehicleTypes || []).map(vID => vehicles[vID]?.caption || vID).join(', ');
                div.innerHTML += `
                    <strong>${ext.caption}</strong><br>
                    Credits: ${ext.credits}<br>
                    Duration: ${ext.duration}<br>
                    Unlocks Vehicles: ${vehicleNames || 'Geen'}<br><br>
                `;
            });

            td.appendChild(div);
            extRow.appendChild(td);
            tbody.appendChild(extRow);

            const toggleBtn = row.querySelector('.button-toggle');
            toggleBtn.onclick = () => {
                const open = div.classList.toggle('show');
                div.style.maxHeight = open ? div.scrollHeight + 'px' : null;
                toggleBtn.textContent = open
                    ? pageTranslations[currentLang].toggle.hide
                    : pageTranslations[currentLang].toggle.show;
            };
        }
    });

    table.appendChild(tbody);
    container.appendChild(table);
}

window.addEventListener('DOMContentLoaded', () => {
    changeLanguage(currentLang);
});
</script>

</body>
</html>
