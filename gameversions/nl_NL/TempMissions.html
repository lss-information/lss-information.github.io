<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meldingen Meldkamerspel (nl_NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #0e0e1a;
    color: #00ffe0;
    text-align: center;
}

/* ===== TOP BAR ===== */
.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
    width: 100%;
    max-width: 100%;
}

.language-selector li {
    flex: 0 0 auto;
}

.language-selector li img {
    width: 30px;
    cursor: pointer;
    transition: transform 0.2s;
}

.language-selector li img:hover {
    transform: scale(1.1);
}

/* ===== BUTTONS ===== */
.button {
    background-color: #1b1b2f;
    color: #00ffe0;
    border: 2px solid #00ffe0;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 8px;
    white-space: nowrap;
    transition: background-color 0.2s, transform 0.2s;
}

.button:hover {
    background-color: #00ffe0;
    color: #1b1b2f;
    transform: scale(1.05);
}

/* ===== TITLES ===== */
h1 {
    margin: 30px 0 10px;
    font-size: 32px;
    text-shadow: 0 0 5px #00ffe0;
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
}

#last-update {
    font-size: 13px;
    color: #8fffee;
    margin-bottom: 20px;
}

/* ===== TABLE ===== */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 95%;
    min-width: 900px;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #1f1f2e;
    color: #00ffe0;
    box-shadow: 0 0 10px #00ffe0;
    border-radius: 10px;
    overflow: hidden;
}

thead th {
    background-color: #2e2e3e;
    padding: 12px;
    border-bottom: 2px solid #00ffe0;
}

tbody td {
    padding: 10px;
    border-bottom: 1px solid #444;
    vertical-align: top;
}

tbody tr:hover {
    background-color: #2a2a3e;
}

/* ===== REQUIREMENTS ===== */
.button-toggle {
    background-color: #1b1b2f;
    color: #00ffe0;
    border: 1px solid #00ffe0;
    padding: 6px 16px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    min-width: 160px;
    white-space: nowrap;
}

.button-toggle:hover {
    background-color: #00ffe0;
    color: #1b1b2f;
}

.requirements-row td {
    background-color: #222233;
    padding: 10px 20px;
    text-align: left;
    font-size: 14px;
}

.requirements-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease;
}

.requirements-content.show {
    opacity: 1;
}

/* ===== FOOTER ===== */
#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #ccc;
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
    .language-selector li img {
        width: 26px;
    }

    .button {
        font-size: 12px;
        padding: 6px 12px;
    }

    .table-wrapper::after {
        content: "← swipe om meer te zien →";
        display: block;
        text-align: center;
        font-size: 12px;
        color: #8fffee;
        margin: 5px 0 15px;
    }
}
</style>
</head>

<body>

<ul class="language-selector">
    <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')"></li>
    <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')"></li>
    <li><img src="../../images/flag_uk.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_us.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_au.gif" alt="English" onclick="changeLanguage('en')"></li>

    <li><a class="button" id="game-button" href="/index">Startpagina</a></li>
    <li><a class="button" id="contact-button" href="/gameversions/contact">Contact</a></li>
    <li><a class="button" id="back-button" href="/gameversions/nl_NL/indexNL">Terug</a></li>
</ul>

<h1 id="page-title">Melding IDs</h1>
<p id="page-message">Overzicht van alle meldingen in Meldkamerspel.</p>
<p id="last-update">Laatste update: laden…</p>

<div class="table-wrapper">
    <div id="sheet-data"></div>
</div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
/* ==== JOUW BESTAANDE SCRIPT (ONGEWIJZIGD) ==== */
const dataFile = 'nl_NL-Data/einsaetze.json';
const translationsFile = 'translations.json';
const lastUpdateFile = 'nl_NL-Data/last_update.txt';

const pageTranslations = {
    nl: {
        title: "Melding IDs",
        message: "Overzicht van alle meldingen in Meldkamerspel.",
        gameButton: "Startpagina",
        contactButton: "Contact",
        backButton: "Terug",
        lastUpdate: "Laatste update",
        tableHeaders: ["ID", "Naam", "POI", "Gemiddelde Credits", "Benodigdheden"],
        toggle: { show: "Toon Benodigdheden", hide: "Verberg Benodigdheden" }
    },
    de: {
        title: "Einsätze IDs",
        message: "Hier finden Sie eine Übersicht aller Einsätze in Leitstellenspiel.",
        gameButton: "Startseite",
        contactButton: "Kontakt",
        backButton: "Zurück",
        lastUpdate: "Letzte Aktualisierung",
        tableHeaders: ["ID", "Name", "POI", "Durchschnittliche Credits", "Benötigte Fahrzeuge"],
        toggle: { show: "Benötigte Fahrzeuge anzeigen", hide: "Benötigte Fahrzeuge verbergen" }
    },
    en: {
        title: "Mission IDs",
        message: "Here you can find an overview of all missions in Missionchief.",
        gameButton: "Homepage",
        contactButton: "Contact",
        backButton: "Back",
        lastUpdate: "Last update",
        tableHeaders: ["ID", "Name", "POI", "Average Credits", "Requirements"],
        toggle: { show: "Show Requirements", hide: "Hide Requirements" }
    }
};

let currentLang = 'nl';

async function loadJSON(path) {
    const res = await fetch(path);
    return await res.json();
}

async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const text = await res.text();
        const date = new Date(text.trim());
        const formatted = date.toLocaleString('nl-NL', {
            dateStyle: 'long',
            timeStyle: 'short'
        });
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: ${formatted}`;
    } catch {
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: onbekend`;
    }
}

async function initMissions() {
    const missions = await loadJSON(dataFile);
    const translations = await loadJSON(translationsFile);

    const container = document.getElementById('sheet-data');
    container.innerHTML = '';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');

    pageTranslations[currentLang].tableHeaders.forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        headerRow.appendChild(th);
    });

    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    missions.forEach(mission => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${mission.id || mission.ID || ''}</td>
            <td>${mission.name || mission.Naam || ''}</td>
            <td>${Array.isArray(mission.place_array)
                ? mission.place_array.join(', ')
                : (mission.place || '').replace(/\n+/g, ', ')}</td>
            <td>${mission.average_credits || ''}</td>
            <td><button class="button-toggle">${pageTranslations[currentLang].toggle.show}</button></td>
        `;
        tbody.appendChild(row);

        const reqRow = document.createElement('tr');
        reqRow.className = 'requirements-row';

        const reqTd = document.createElement('td');
        reqTd.colSpan = 5;

        const reqDiv = document.createElement('div');
        reqDiv.className = 'requirements-content';

        if (mission.requirements) {
            for (const key in mission.requirements) {
                const name = translations[key] || key;
                const value = mission.requirements[key];
                if (typeof value === 'object') {
                    for (const sub in value) {
                        reqDiv.innerHTML += `${name} (${translations[sub] || sub}): ${value[sub]}<br>`;
                    }
                } else {
                    reqDiv.innerHTML += `${name}: ${value}<br>`;
                }
            }
        }

        reqTd.appendChild(reqDiv);
        reqRow.appendChild(reqTd);
        tbody.appendChild(reqRow);

        row.querySelector('.button-toggle').addEventListener('click', () => {
            const shown = reqDiv.classList.toggle('show');
            reqDiv.style.maxHeight = shown ? reqDiv.scrollHeight + 'px' : null;
        });
    });

    table.appendChild(tbody);
    container.appendChild(table);
}

function changeLanguage(lang) {
    currentLang = lang;

    const t = pageTranslations[lang] || pageTranslations['en'];

    document.title = t.title;
    document.getElementById('page-title').textContent = t.title;
    document.getElementById('page-message').textContent = t.message;
    document.getElementById('game-button').textContent = t.gameButton;
    document.getElementById('contact-button').textContent = t.contactButton;
    document.getElementById('back-button').textContent = t.backButton;

    // Update last update text
    loadLastUpdate();

    // Update table headers
    const table = document.querySelector('table');
    if (table) {
        const ths = table.querySelectorAll('thead th');
        t.tableHeaders.forEach((header, i) => {
            if (ths[i]) ths[i].textContent = header;
        });
    }

    // Update toggle buttons (open/dicht blijft behouden)
    document.querySelectorAll('.button-toggle').forEach(button => {
        const reqRow = button.closest('tr')?.nextElementSibling;
        const reqDiv = reqRow?.querySelector('.requirements-content');
        if (!reqDiv) return;

        const isShown = reqDiv.classList.contains('show');
        button.textContent = isShown ? t.toggle.hide : t.toggle.show;
    });
}


    
const startYear = 2024;
const currentYear = new Date().getFullYear();
document.getElementById('footer-year').textContent =
    startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

loadLastUpdate();
initMissions();
</script>

</body>
</html>
