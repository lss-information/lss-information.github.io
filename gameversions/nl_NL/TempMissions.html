<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meldingen Meldkamerspel (nl_NL)</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Orbitron', sans-serif;
        background-color: #0e0e1a;
        color: #00ffe0;
        text-align: center;
    }

    h1 {
        margin: 30px 0 10px;
        font-size: 32px;
        text-shadow: 0 0 5px #00ffe0;
    }

    .button-container {
        margin: 20px 0;
    }

    .button {
        background-color: #1b1b2f;
        color: #00ffe0;
        border: 2px solid #00ffe0;
        padding: 8px 16px;
        text-decoration: none;
        border-radius: 8px;
        margin: 0 5px;
        transition: background-color 0.2s, transform 0.2s;
    }

    .button:hover {
        background-color: #00ffe0;
        color: #1b1b2f;
        transform: scale(1.05);
    }

    table {
        width: 95%;
        max-width: 1200px;
        margin: 20px auto;
        border-collapse: collapse;
        background-color: #1f1f2e;
        color: #00ffe0;
        box-shadow: 0 0 10px #00ffe0;
        border-radius: 10px;
        overflow: hidden;
    }

    thead th {
        background-color: #2e2e3e;
        padding: 12px;
        border-bottom: 2px solid #00ffe0;
    }

    tbody td {
        padding: 10px;
        border-bottom: 1px solid #444;
    }

    tbody tr:hover {
        background-color: #2a2a3e;
    }

    details {
        background-color: #1b1b2f;
        color: #00ffe0;
        padding: 5px 10px;
        border-radius: 5px;
        margin-top: 5px;
        text-align: left;
    }

    summary {
        cursor: pointer;
        font-weight: bold;
    }

    #footer {
        margin-top: 40px;
        padding: 20px;
        font-size: 12px;
        color: #ccc;
    }
</style>
</head>
<body>

<h1>Melding IDs</h1>
<p>Hier vindt u een overzicht van alle meldingen in Meldkamerspel. Klik op een ID voor details.</p>

<div class="button-container">
    <a class="button" href="/index">Startpagina</a>
    <a class="button" href="/gameversions/contact">Contact</a>
</div>

<div id="missions-table"></div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const currentLang = 'nl'; // voor nu Nederlands, kan uitbreiden
let vehicleTranslations = {};

// Laad externe vertalingen
async function loadTranslations() {
    try {
        const response = await fetch('translations.json');
        vehicleTranslations = await response.json();
    } catch(e) {
        console.error("Kon translations.json niet laden:", e);
    }
}

// Laad en toon de missions
async function loadMissions() {
    try {
        const response = await fetch('nl_NL-Data/einsaetze.json');
        const data = await response.json();

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        ['ID', 'Naam', 'POI', 'Gemiddelde Credits', 'Details'].forEach(text => {
            const th = document.createElement('th');
            th.textContent = text;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');

        data.forEach(mission => {
            const tr = document.createElement('tr');

            // Basis info
            ['ID', 'Naam', 'POI', 'Gemiddelde Credits'].forEach(field => {
                const td = document.createElement('td');
                td.textContent = mission[field] || '';
                tr.appendChild(td);
            });

            // Details met dropdown
            const tdDetails = document.createElement('td');
            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = 'Requirements / Chances';
            details.appendChild(summary);

            const ul = document.createElement('ul');

            // Requirements
            if (mission.requirements) {
                const reqHeader = document.createElement('li');
                reqHeader.textContent = 'Requirements:';
                const reqList = document.createElement('ul');

                for (let veh in mission.requirements) {
                    const li = document.createElement('li');
                    const name = vehicleTranslations[veh] ? vehicleTranslations[veh][currentLang] : veh;
                    li.textContent = `${name}: ${mission.requirements[veh]}`;
                    reqList.appendChild(li);
                }
                reqHeader.appendChild(reqList);
                ul.appendChild(reqHeader);
            }

            // Chances
            if (mission.chances) {
                const chHeader = document.createElement('li');
                chHeader.textContent = 'Chances:';
                const chList = document.createElement('ul');
                for (let veh in mission.chances) {
                    const li = document.createElement('li');
                    const name = vehicleTranslations[veh] ? vehicleTranslations[veh][currentLang] : veh;
                    li.textContent = `${name}: ${mission.chances[veh]}%`;
                    chList.appendChild(li);
                }
                chHeader.appendChild(chList);
                ul.appendChild(chHeader);
            }

            details.appendChild(ul);
            tdDetails.appendChild(details);
            tr.appendChild(tdDetails);

            tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        document.getElementById('missions-table').appendChild(table);
    } catch(e) {
        console.error("Kon einsaetze.json niet laden:", e);
    }
}

// Start alles
async function initPage() {
    await loadTranslations();
    await loadMissions();

    const startYear = 2024;
    const currentYear = new Date().getFullYear();
    document.getElementById('footer-year').textContent = startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;
}

initPage();
</script>

</body>
</html>
