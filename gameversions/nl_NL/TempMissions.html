<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meldingen Meldkamerspel (nl_NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #0e0e1a;
    color: #00ffe0;
    text-align: center;
}

h1 {
    margin: 30px 0 10px;
    font-size: 32px;
    text-shadow: 0 0 5px #00ffe0;
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
}

#last-update {
    font-size: 13px;
    color: #8fffee;
    margin-bottom: 20px;
}

table {
    width: 95%;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #1f1f2e;
    color: #00ffe0;
    box-shadow: 0 0 10px #00ffe0;
    border-radius: 10px;
    overflow: hidden;
}

thead th {
    background-color: #2e2e3e;
    padding: 12px;
    border-bottom: 2px solid #00ffe0;
}

tbody td {
    padding: 10px;
    border-bottom: 1px solid #444;
    vertical-align: top;
}

tbody tr:hover {
    background-color: #2a2a3e;
}

.button-toggle {
    background-color: #1b1b2f;
    color: #00ffe0;
    border: 1px solid #00ffe0;
    padding: 4px 8px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
}

.button-toggle:hover {
    background-color: #00ffe0;
    color: #1b1b2f;
}

.requirements-row td {
    background-color: #222233;
    padding: 10px 20px;
    text-align: left;
    font-size: 14px;
}

.requirements-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease;
    opacity: 0;
}

.requirements-content.show {
    opacity: 1;
}

#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #ccc;
}
</style>
</head>

<body>

<h1>Melding IDs</h1>
<p>Overzicht van alle meldingen in Meldkamerspel.</p>
<p id="last-update">Laatste update: laden…</p>

<div id="sheet-data"></div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const dataFile = 'nl_NL-Data/einsaetze.json';
const translationsFile = 'translations.json';
const lastUpdateFile = 'nl_NL-Data/last_update.txt';

async function loadJSON(path) {
    const res = await fetch(path);
    return await res.json();
}

async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const text = await res.text();

        const date = new Date(text.trim());
        const formatted = date.toLocaleString('nl-NL', {
            dateStyle: 'long',
            timeStyle: 'short'
        });

        document.getElementById('last-update').textContent =
            `Laatste update: ${formatted}`;
    } catch {
        document.getElementById('last-update').textContent =
            'Laatste update: onbekend';
    }
}

async function initMissions() {
    const missions = await loadJSON(dataFile);
    const translations = await loadJSON(translationsFile);

    const container = document.getElementById('sheet-data');

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');

    ['ID', 'Naam', 'POI', 'Gemiddelde Credits', 'Benodigdheden']
        .forEach(col => {
            const th = document.createElement('th');
            th.textContent = col;
            headerRow.appendChild(th);
        });

    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    missions.forEach(mission => {
        const row = document.createElement('tr');

        row.innerHTML = `
            <td>${mission.id || mission.ID || ''}</td>
            <td>${mission.name || mission.Naam || ''}</td>
            <td>${
                Array.isArray(mission.place_array)
                    ? mission.place_array.join(', ')
                    : (mission.place || '').replace(/\n+/g, ', ')
            }</td>
            <td>${mission.average_credits || mission['Gemiddelde Credits'] || ''}</td>
            <td><button class="button-toggle">Toon Benodigdheden</button></td>
        `;

        tbody.appendChild(row);

        const reqRow = document.createElement('tr');
        reqRow.className = 'requirements-row';

        const reqTd = document.createElement('td');
        reqTd.colSpan = 5;

        const reqDiv = document.createElement('div');
        reqDiv.className = 'requirements-content';

        if (mission.requirements) {
            for (const key in mission.requirements) {
                const name = translations[key] || key;
                const value = mission.requirements[key];

                if (typeof value === 'object') {
                    for (const sub in value) {
                        reqDiv.innerHTML += `${name} (${translations[sub] || sub}): ${value[sub]}<br>`;
                    }
                } else {
                    reqDiv.innerHTML += `${name}: ${value}<br>`;
                }
            }
        }

        reqTd.appendChild(reqDiv);
        reqRow.appendChild(reqTd);
        tbody.appendChild(reqRow);

        row.querySelector('button').addEventListener('click', () => {
            reqDiv.classList.toggle('show');
            reqDiv.style.maxHeight = reqDiv.classList.contains('show')
                ? reqDiv.scrollHeight + 'px'
                : null;
        });
    });

    table.appendChild(tbody);
    container.appendChild(table);
}

const startYear = 2024;
const currentYear = new Date().getFullYear();
document.getElementById('footer-year').textContent =
    startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

loadLastUpdate();
initMissions();
</script>

</body>
</html>
