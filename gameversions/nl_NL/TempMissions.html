<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meldingen Meldkamerspel (nl_NL)</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #0e0e1a;
    color: #00ffe0;
    text-align: center;
}

h1 {
    margin: 30px 0 10px;
    font-size: 32px;
    text-shadow: 0 0 5px #00ffe0;
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
}

#last-update {
    font-size: 13px;
    color: #8fffee;
    margin-bottom: 20px;
}

.language-selector {
    list-style: none;
    display: flex;
    justify-content: center;
    margin-top: 20px;
    padding: 0;
    gap: 10px;
}

.language-selector li img {
    width: 30px;
    cursor: pointer;
    transition: transform 0.2s;
}

.language-selector li img:hover {
    transform: scale(1.1);
}

table {
    width: 95%;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #1f1f2e;
    color: #00ffe0;
    box-shadow: 0 0 10px #00ffe0;
    border-radius: 10px;
    overflow: hidden;
}

thead th {
    background-color: #2e2e3e;
    padding: 12px;
    border-bottom: 2px solid #00ffe0;
}

tbody td {
    padding: 10px;
    border-bottom: 1px solid #444;
    vertical-align: top;
}

tbody tr:hover {
    background-color: #2a2a3e;
}

.button-toggle {
    background-color: #1b1b2f;
    color: #00ffe0;
    border: 1px solid #00ffe0;
    padding: 6px 16px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    min-width: 160px;
    white-space: nowrap;
    transition: all 0.2s ease, box-shadow 0.3s ease, text-shadow 0.3s ease;
}

.button-toggle:hover {
    background-color: #00ffe0;
    color: #1b1b2f;
    box-shadow: 0 0 10px #00ffe0, 0 0 20px #00ffe0;
    text-shadow: 0 0 5px #00ffe0;
}

.button-toggle.active {
    box-shadow: 0 0 15px #00ffe0, 0 0 30px #00ffe0;
    text-shadow: 0 0 10px #00ffe0;
}

#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #ccc;
}
</style>
</head>
<body>

<ul class="language-selector">
    <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')"></li>
    <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')"></li>
    <li><img src="../../images/flag_uk.gif" alt="English (UK)" onclick="changeLanguage('en-uk')"></li>
    <li><img src="../../images/flag_us.gif" alt="English (US)" onclick="changeLanguage('en-us')"></li>
    <li><img src="../../images/flag_au.gif" alt="English (AU)" onclick="changeLanguage('en-au')"></li>
</ul>

<h1 id="page-title">Melding IDs</h1>
<p id="page-message">Hier kunt u een overzicht vinden van alle meldingen in Meldkamerspel. Klik op "Toon Benodigdheden" om details te bekijken.</p>
<p id="last-update">Laatste update: laden…</p>

<div id="sheet-data"></div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const dataFile = 'nl_NL-Data/einsaetze.json';
const translationsFile = 'translations.json';
const lastUpdateFile = 'nl_NL-Data/last_update.txt';

// Laad JSON
async function loadJSON(path) {
    const res = await fetch(path);
    return await res.json();
}

// Laad laatste update
async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const text = await res.text();
        const date = new Date(text.trim());
        const formatted = date.toLocaleString('nl-NL', { dateStyle: 'long', timeStyle: 'short' });
        document.getElementById('last-update').textContent = `Laatste update: ${formatted}`;
    } catch {
        document.getElementById('last-update').textContent = 'Laatste update: onbekend';
    }
}

// Init tabel
async function initMissions() {
    const missions = await loadJSON(dataFile);
    const translations = await loadJSON(translationsFile);
    const container = document.getElementById('sheet-data');

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    ['ID', 'Naam', 'POI', 'Gemiddelde Credits', 'Benodigdheden'].forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    missions.forEach(mission => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${mission.id || mission.ID || ''}</td>
            <td>${mission.name || mission.Naam || ''}</td>
            <td>${Array.isArray(mission.place_array) ? mission.place_array.join(', ') : (mission.place || '').replace(/\n+/g, ', ')}</td>
            <td>${mission.average_credits || mission['Gemiddelde Credits'] || ''}</td>
            <td><button class="button-toggle">Toon Benodigdheden</button></td>
        `;
        tbody.appendChild(row);

        const reqRow = document.createElement('tr');
        reqRow.className = 'requirements-row';
        const reqTd = document.createElement('td');
        reqTd.colSpan = 5;
        const reqDiv = document.createElement('div');
        reqDiv.className = 'requirements-content';

        if (mission.requirements) {
            for (const key in translations) {
                if (mission.requirements[key]) {
                    const value = mission.requirements[key];
                    const name = translations[key] || key;
                    if (typeof value === "object") {
                        for (const sub in value) {
                            reqDiv.innerHTML += `${name} (${translations[sub] || sub}): ${value[sub]}<br>`;
                        }
                    } else {
                        reqDiv.innerHTML += `${name}: ${value}<br>`;
                    }
                }
            }
        }

        reqTd.appendChild(reqDiv);
        reqRow.appendChild(reqTd);
        tbody.appendChild(reqRow);

        // Button toggle
        row.querySelector('button').addEventListener('click', () => {
            const btn = row.querySelector('button');
            const isShown = reqDiv.classList.toggle('show');
            reqDiv.style.maxHeight = isShown ? reqDiv.scrollHeight + 'px' : null;
            btn.textContent = isShown ? 'Verberg Benodigdheden' : 'Toon Benodigdheden';
            btn.classList.toggle('active', isShown);
        });
    });

    table.appendChild(tbody);
    container.appendChild(table);
}

// Footer jaar
const startYear = 2024;
const currentYear = new Date().getFullYear();
document.getElementById('footer-year').textContent =
    startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

// Standaard taal
let currentLang = "nl";

// Vertalingen
const translations = {
    nl: {
        headers: ["ID", "Naam", "POI", "Gemiddelde Credits", "Benodigdheden"],
        showButton: "Toon Benodigdheden",
        hideButton: "Verberg Benodigdheden",
        pageTitle: "Melding IDs",
        pageMessage: "Hier kunt u een overzicht vinden van alle meldingen in Meldkamerspel. Klik op \"Toon Benodigdheden\" om details te bekijken.",
    },
    de: {
        headers: ["ID", "Name", "POI", "Durchschnittliche Credits", "Benötigte Ausrüstung"],
        showButton: "Benötigte anzeigen",
        hideButton: "Ausblenden",
        pageTitle: "Einsätze IDs",
        pageMessage: "Hier finden Sie eine Übersicht aller Einsätze in Leitstellenspiel.",
    },
    "en-uk": {
        headers: ["ID", "Name", "POI", "Average Credits", "Requirements"],
        showButton: "Show Requirements",
        hideButton: "Hide Requirements",
        pageTitle: "Mission IDs",
        pageMessage: "Here you can find an overview of all missions in Missionchief.",
    },
    "en-us": {
        headers: ["ID", "Name", "POI", "Average Credits", "Requirements"],
        showButton: "Show Requirements",
        hideButton: "Hide Requirements",
        pageTitle: "Mission IDs",
        pageMessage: "Here you can find an overview of all missions in Missionchief.",
    },
    "en-au": {
        headers: ["ID", "Name", "POI", "Average Credits", "Requirements"],
        showButton: "Show Requirements",
        hideButton: "Hide Requirements",
        pageTitle: "Mission IDs",
        pageMessage: "Here you can find an overview of all missions in Missionchief.",
    }
};

// Functie om taal te veranderen
function changeLanguage(lang) {
    currentLang = lang;

    // Pagina tekst
    document.title = translations[lang].pageTitle;
    document.getElementById('page-title').textContent = translations[lang].pageTitle;
    document.getElementById('page-message').textContent = translations[lang].pageMessage;

    // Als de tabel al bestaat, update headers + knoppen
    const table = document.querySelector('#sheet-data table');
    if (table) {
        const headerCells = table.querySelectorAll('thead th');
        translations[lang].headers.forEach((text, idx) => {
            if (headerCells[idx]) headerCells[idx].textContent = text;
        });

        // Update alle toggle knoppen
        table.querySelectorAll('.button-toggle').forEach(btn => {
            if (btn.dataset.expanded === "true") {
                btn.textContent = translations[lang].hideButton;
            } else {
                btn.textContent = translations[lang].showButton;
            }
        });
    }
}

// Tabel opbouwen met knoppen die tekst dynamisch aanpassen
function createMissionTable(missions) {
    const container = document.getElementById('sheet-data');
    const table = document.createElement('table');

    // Header
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    translations[currentLang].headers.forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    // Body
    const tbody = document.createElement('tbody');
    missions.forEach(mission => {
        const row = document.createElement('tr');

        row.innerHTML = `
            <td>${mission.id || mission.ID || ''}</td>
            <td>${mission.name || mission.Naam || ''}</td>
            <td>${Array.isArray(mission.place_array) ? mission.place_array.join(', ') : (mission.place || '').replace(/\n+/g, ', ')}</td>
            <td>${mission.average_credits || mission['Gemiddelde Credits'] || ''}</td>
            <td><button class="button-toggle">${translations[currentLang].showButton}</button></td>
        `;
        tbody.appendChild(row);

        // Benodigdheden rij
        const reqRow = document.createElement('tr');
        reqRow.className = 'requirements-row';
        const reqTd = document.createElement('td');
        reqTd.colSpan = 5;
        const reqDiv = document.createElement('div');
        reqDiv.className = 'requirements-content';
        if (mission.requirements) {
            for (const key in mission.requirements) {
                const val = mission.requirements[key];
                if (typeof val === 'object') {
                    for (const sub in val) {
                        reqDiv.innerHTML += `${key} (${sub}): ${val[sub]}<br>`;
                    }
                } else {
                    reqDiv.innerHTML += `${key}: ${val}<br>`;
                }
            }
        }
        reqTd.appendChild(reqDiv);
        reqRow.appendChild(reqTd);
        tbody.appendChild(reqRow);

        // Toggle knop
        const btn = row.querySelector('button');
        btn.dataset.expanded = "false";
        btn.addEventListener('click', () => {
            const isExpanded = reqDiv.classList.toggle('show');
            reqDiv.style.maxHeight = isExpanded ? reqDiv.scrollHeight + 'px' : null;
            btn.textContent = isExpanded ? translations[currentLang].hideButton : translations[currentLang].showButton;
            btn.dataset.expanded = isExpanded ? "true" : "false";
        });
    });
    table.appendChild(tbody);
    container.appendChild(table);
}

// Bij pagina load: standaard NL
window.addEventListener('DOMContentLoaded', () => {
    changeLanguage('nl');
});



// Start alles
loadLastUpdate();
initMissions();
</script>

</body>
</html>
