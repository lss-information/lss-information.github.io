<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.4, maximum-scale=1.0">
<title>Meldingen Meldkamerspel (NL)</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
    body { margin: 0; padding: 0; font-family: 'Orbitron', sans-serif; background-color: #1e1e28; color: #dddddd; text-align: center; }
    .button { background-color: #2c2c3c; color: #dddddd; border: 2px solid #555566; padding: 8px 16px; text-decoration: none; border-radius: 8px; transition: 0.2s; font-size: 12px; cursor: pointer; }
    .button:hover { background-color: #444456; color: #ffffff; }
    
    .filter-section { background-color: #252535; margin: 20px auto; padding: 15px; border-radius: 12px; max-width: 900px; border: 1px solid #444455; }
    .search-container { display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; }
    
    #extra-filters { display: none; padding-top: 15px; margin-top: 15px; border-top: 1px solid #444455; justify-content: center; gap: 15px; flex-wrap: wrap; }
    .filter-input, .filter-select { padding: 8px 12px; border-radius: 6px; border: 1px solid #555566; background-color: #2c2c3c; color: #dddddd; font-family: 'Orbitron', sans-serif; }

    table { width: 95%; max-width: 1200px; margin: 20px auto; border-collapse: collapse; background-color: #2a2a3a; border-radius: 10px; overflow: hidden; }
    thead th { background-color: #3a3a4a; padding: 12px; border-bottom: 2px solid #555566; color: #eeeeee; font-family: 'Roboto', sans-serif; }
    tbody td { padding: 10px; border-bottom: 1px solid #444455; font-family: 'Roboto', sans-serif; font-size: 16px; }
    
    .requirements-row { display: none; background-color: #232330; }
    .requirements-row.active { display: table-row; }
    .requirements-content { padding: 15px; text-align: left; line-height: 1.6; }

    /* Loading indicator */
    #loading { font-size: 20px; margin: 50px; color: #ffcc00; }
    .hidden { display: none !important; }
</style>
</head>
<body>

<h1 id="page-title">Laden...</h1>

<div class="filter-section">
    <div class="search-container">
        <input type="text" id="mission-search" placeholder="Melding zoeken..." class="filter-input" style="width:300px;">
        <button class="button" id="toggle-filter-btn" onclick="toggleExtraFilters()">Filters tonen ▼</button>
    </div>
    <div id="extra-filters">
        <select id="category-filter" class="filter-select"><option value="">Alle Categorieën</option></select>
        <select id="poi-filter" class="filter-select"><option value="">Alle Locaties (POI)</option></select>
    </div>
</div>

<div id="loading">Meldingen worden geladen, een moment geduld...</div>

<div class="table-wrapper">
    <table id="mission-table" class="hidden">
        <thead>
            <tr id="table-head-row"></tr>
        </thead>
        <tbody id="mission-body"></tbody>
    </table>
</div>

<footer id="footer" style="margin: 40px 0; font-size: 12px; color: #666;">
    &copy; <span id="footer-year"></span> JR04 - Data vanuit Meldkamerspel
</footer>

<script>
let missions = [];
let translations = {};
let currentLang = 'nl';

const pageTranslations = {
    nl: { title: "Melding IDs", categoryAll: "Alle Categorieën", poiAll: "Alle Locaties (POI)", btnShow: "Filters tonen ▼", btnHide: "Filters verbergen ▲", headers: ["ID", "Naam", "POI", "Credits", "Info"] },
    de: { title: "Einsätze IDs", categoryAll: "Alle Kategorien", poiAll: "Alle POIs", btnShow: "Filter anzeigen ▼", btnHide: "Filter ausblenden ▲", headers: ["ID", "Name", "POI", "Credits", "Info"] },
    en: { title: "Mission IDs", categoryAll: "All Categories", poiAll: "All POIs", btnShow: "Show Filters ▼", btnHide: "Hide Filters ▲", headers: ["ID", "Name", "POI", "Credits", "Info"] }
};

async function fetchData() {
    try {
        const [mRes, tRes] = await Promise.all([
            fetch('nl_NL-Data/einsaetze.json'),
            fetch('translations.json')
        ]);
        missions = await mRes.json();
        translations = await tRes.json();
        
        setupFilters();
        renderTable();
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('mission-table').classList.remove('hidden');
        document.getElementById('page-title').textContent = pageTranslations[currentLang].title;
    } catch (e) {
        document.getElementById('loading').textContent = "Fout bij laden van data. Check of de bestanden bestaan.";
    }
}

function setupFilters() {
    const cats = new Set();
    const pois = new Set();
    missions.forEach(m => {
        if (m.mission_categories) m.mission_categories.forEach(c => cats.add(c));
        if (m.place_array) m.place_array.forEach(p => { if(p) pois.add(p); });
    });

    fillSelect('category-filter', cats, 'cat_', pageTranslations[currentLang].categoryAll);
    fillSelect('poi-filter', pois, '', pageTranslations[currentLang].poiAll);
}

function fillSelect(id, set, prefix, defText) {
    const s = document.getElementById(id);
    s.innerHTML = `<option value="">${defText}</option>`;
    Array.from(set).sort().forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = translations[prefix + v] || translations[v] || v;
        s.appendChild(o);
    });
}

function renderTable() {
    const tbody = document.getElementById('mission-body');
    const headRow = document.getElementById('table-head-row');
    
    // Headers
    headRow.innerHTML = pageTranslations[currentLang].headers.map(h => `<th>${h}</th>`).join('');

    // Rijen (we bouwen één grote string, dit is sneller voor de browser dan duizenden losse elementen)
    let html = '';
    missions.forEach(m => {
        html += `
            <tr class="mission-row" data-id="${m.id}">
                <td>${m.id}</td>
                <td style="text-align:left;">${m.name}</td>
                <td>${(m.place_array || []).join(', ') || '-'}</td>
                <td>${m.average_credits ?? '?'}</td>
                <td><button class="button" onclick="toggleDetails(${m.id})">Details</button></td>
            </tr>
            <tr id="details-${m.id}" class="requirements-row">
                <td colspan="5">
                    <div class="requirements-content">
                        ${formatDetails(m)}
                    </div>
                </td>
            </tr>
        `;
    });
    tbody.innerHTML = html;
}

function formatDetails(m) {
    let res = `<strong>Categorie:</strong> ${(m.mission_categories || []).map(c => translations['cat_'+c]||c).join(', ')}<br>`;
    if (m.requirements) {
        res += `<strong>Voertuigen:</strong><br>`;
        for (const [k, v] of Object.entries(m.requirements)) {
            res += `• ${translations[k] || k}: ${v}<br>`;
        }
    }
    return res;
}

function toggleDetails(id) {
    const row = document.getElementById(`details-${id}`);
    row.classList.toggle('active');
}

function filterMissions() {
    const search = document.getElementById('mission-search').value.toLowerCase();
    const cat = document.getElementById('category-filter').value;
    const poi = document.getElementById('poi-filter').value;
    
    const rows = document.getElementsByClassName('mission-row');
    
    for (let row of rows) {
        const id = row.getAttribute('data-id');
        const m = missions.find(x => x.id == id);
        const detailRow = document.getElementById(`details-${id}`);

        const matchSearch = row.innerText.toLowerCase().includes(search);
        const matchCat = !cat || (m.mission_categories && m.mission_categories.includes(cat));
        const matchPoi = !poi || (m.place_array && m.place_array.includes(poi));

        if (matchSearch && matchCat && matchPoi) {
            row.style.display = "";
        } else {
            row.style.display = "none";
            detailRow.classList.remove('active');
        }
    }
}

function toggleExtraFilters() {
    const f = document.getElementById('extra-filters');
    const b = document.getElementById('toggle-filter-btn');
    const show = f.style.display === 'flex';
    f.style.display = show ? 'none' : 'flex';
    b.textContent = show ? pageTranslations[currentLang].btnShow : pageTranslations[currentLang].btnHide;
}

// Event Listeners
document.getElementById('mission-search').addEventListener('input', filterMissions);
document.getElementById('category-filter').addEventListener('change', filterMissions);
document.getElementById('poi-filter').addEventListener('change', filterMissions);

document.getElementById('footer-year').textContent = new Date().getFullYear();
fetchData();
</script>
</body>
</html>
