<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.4, maximum-scale=1.0">
<title>Meldingen Meldkamerspel (NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28;
    color: #dddddd;
    text-align: center;
}

.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
}

.language-selector img {
    height: 24px;
    cursor: pointer;
    border: 2px solid #555566;
    border-radius: 4px;
}

.language-selector img:hover {
    transform: scale(1.1);
}

.button {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 2px solid #555566;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 8px;
    font-size: 12px;
}

.button:hover {
    background-color: #444456;
}

h1 {
    margin: 30px 0 10px;
    font-size: 32px;
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
}

#last-update {
    font-size: 13px;
    color: #aaaaaa;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 95%;
    min-width: 900px;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #2a2a3a;
}

thead th {
    background-color: #3a3a4a;
    padding: 12px;
    font-size: 18px;
}

tbody td {
    padding: 12px;
    border-bottom: 1px solid #444455;
    font-size: 18px;
}

.button-toggle {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 1px solid #555566;
    padding: 6px 16px;
    cursor: pointer;
}

.requirements-row td {
    background-color: #262632;
    text-align: left;
}

.requirements-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: 0.3s;
}

.requirements-content.show {
    opacity: 1;
}

#footer {
    margin-top: 40px;
    font-size: 12px;
}
</style>
</head>

<body>

<ul class="language-selector">
    <li><img src="../../images/flag_nl.gif" onclick="changeLanguage('nl')"></li>
    <li><img src="../../images/flag_de.gif" onclick="changeLanguage('de')"></li>
    <li><img src="../../images/flag_uk.gif" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_us.gif" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_au.gif" onclick="changeLanguage('en')"></li>

    <li><a class="button" id="game-button" href="/index">Startpagina</a></li>
    <li><a class="button" id="contact-button" href="/gameversions/contact">Contact</a></li>
    <li><a class="button" id="back-button" href="/gameversions/nl_NL/indexNL">Terug</a></li>
</ul>

<h1 id="page-title"></h1>
<p id="page-message"></p>
<p id="last-update"></p>

<div style="margin:20px;">
    <input
        type="text"
        id="mission-search"
        placeholder="Melding zoeken..."
        style="padding:8px;width:300px;background:#2c2c3c;color:#ddd;border:1px solid #555;">
</div>

<div class="table-wrapper">
    <div id="sheet-data"></div>
</div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04
</footer>

<script>
const dataFile = 'nl_NL-Data/einsaetze.json';
const translationsFile = 'translations.json';

const pageTranslations = {
    nl: {
        title: "Melding IDs",
        message: "Overzicht van alle meldingen in Meldkamerspel (NL).",
        tableHeaders: ["ID", "Naam", "POI", "Gemiddelde Credits", "Benodigdheden"],
        toggle: { show: "Toon Benodigdheden", hide: "Verberg Benodigdheden" }
    }
};

let currentLang = 'nl';

async function initMissions() {
    const missions = await (await fetch(dataFile)).json();
    const translations = await (await fetch(translationsFile)).json();

    const container = document.getElementById('sheet-data');
    container.innerHTML = '';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');

    pageTranslations[currentLang].tableHeaders.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        tr.appendChild(th);
    });

    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    missions.forEach(m => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${m.id}</td>
            <td>${m.name}</td>
            <td>${(m.place_array || []).join(', ')}</td>
            <td>${m.average_credits}</td>
            <td><button class="button-toggle">${pageTranslations[currentLang].toggle.show}</button></td>
        `;
        tbody.appendChild(row);

        const reqRow = document.createElement('tr');
        reqRow.className = 'requirements-row';
        const td = document.createElement('td');
        td.colSpan = 5;

        const div = document.createElement('div');
        div.className = 'requirements-content';

        for (const k in m.requirements || {}) {
            div.innerHTML += `${translations[k] || k}: ${m.requirements[k]}<br>`;
        }

        if (m.additional && typeof m.additional.possible_patient !== 'undefined') {
            div.innerHTML += `<strong>Possible Patient:</strong> ${m.additional.possible_patient}<br>`;
        }

        td.appendChild(div);
        reqRow.appendChild(td);
        tbody.appendChild(reqRow);

        row.querySelector('.button-toggle').onclick = () => {
            div.classList.toggle('show');
            div.style.maxHeight = div.classList.contains('show') ? div.scrollHeight + 'px' : null;
        };
    });

    table.appendChild(tbody);
    container.appendChild(table);
}

document.getElementById('footer-year').textContent = new Date().getFullYear();
window.addEventListener('DOMContentLoaded', initMissions);
</script>

</body>
</html>
