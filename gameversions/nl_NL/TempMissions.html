<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.4, maximum-scale=1.0">
<title>Meldingen Meldkamerspel (NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28;
    color: #dddddd;
    text-align: center;
}

.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
}

.button {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 2px solid #555566;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.2s, transform 0.2s, color 0.2s;
    font-size: 12px;
    cursor: pointer;
}

.button:hover {
    background-color: #444456;
    color: #ffffff;
    transform: scale(1.05);
}

h1 {
    margin: 30px 0 10px;
    font-size: 32px;
    color: #eeeeee;
    text-shadow: 0 0 5px rgba(0,0,0,0.5);
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
    color: #cccccc;
}

#last-update {
    font-size: 13px;
    color: #aaaaaa;
}

#swipe-hint {
    display: none;
    font-size: 12px;
    color: #bbbbbb;
    margin: 8px auto 5px;
    text-align: center;
    opacity: 0.9;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 95%;
    min-width: 900px;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #2a2a3a;
    border-radius: 10px;
}

thead th {
    background-color: #3a3a4a;
    padding: 12px;
    border-bottom: 2px solid #555566;
    color: #eeeeee;
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
}

tbody td {
    padding: 12px;
    border-bottom: 1px solid #444455;
    color: #dddddd;
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
}

tbody tr:hover {
    background-color: #3c3c4c;
}

.button-toggle {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 1px solid #555566;
    padding: 6px 16px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
}

.requirements-row td {
    background-color: #262632;
    text-align: left;
    font-size: 17px;
    color: #cccccc;
    font-family: 'Roboto', sans-serif;
}

.requirements-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
    padding: 0 8px;
    font-family: 'Roboto', sans-serif;
    font-size: 17px;
    line-height: 1.5;
}

.requirements-content.show {
    opacity: 1;
    padding: 6px 8px;
}

/* Modal Styles */
#exportModal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.8);
    align-items: center;
    justify-content: center;
}

.modal-content {
    background-color: #2a2a3a;
    padding: 25px;
    border-radius: 12px;
    border: 2px solid #555566;
    max-width: 600px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    font-family: 'Roboto', sans-serif;
    text-align: left;
}

.category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 20px 0;
}

.category-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #dddddd;
    font-size: 14px;
    cursor: pointer;
}

#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #888888;
}

.language-selector img {
    height: 24px;
    width: auto;
    cursor: pointer;
    transition: transform 0.2s, border 0.2s;
    border: 2px solid #555566;
    border-radius: 4px;
}

.language-selector img:hover {
    transform: scale(1.1);
}

@media (max-width: 600px) {
    .language-selector img {
        height: 22px;
        width: auto;
    }
    .category-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<ul class="language-selector">
    <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')"></li>
    <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')"></li>
    <li><img src="../../images/flag_uk.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_us.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="../../images/flag_au.gif" alt="English" onclick="changeLanguage('en')"></li>

    <li><a class="button" id="game-button" href="/index">Startpagina</a></li>
    <li><a class="button" id="contact-button" href="/gameversions/contact">Contact</a></li>
    <li><a class="button" id="back-button" href="/gameversions/nl_NL/indexNL">Terug</a></li>
</ul>

<h1 id="page-title"></h1>
<p id="page-message"></p>
<p id="last-update"></p>

<div style="margin: 20px;">
    <input
        type="text"
        id="mission-search"
        placeholder="Melding zoeken..."
        style="padding:8px 12px; width:300px; border-radius:6px; border:1px solid #555566; background-color:#2c2c3c; color:#dddddd; font-family:'Orbitron', sans-serif;">
</div>

<div style="margin: 20px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
    <button class="button" onclick="exportAllToExcel()" style="background-color: #2e7d32; border-color: #1b5e20;">Download Alles (.xlsx)</button>
    <button class="button" onclick="openExportModal()" style="background-color: #1565c0; border-color: #0d47a1;">Selecteer Types & Download</button>
</div>

<div id="swipe-hint"></div>

<div style="margin: 20px; display:flex; justify-content:center; gap:10px; align-items:center; flex-wrap:wrap;">
    <select id="compare-mission-1" style="padding:6px 10px; border-radius:6px; border:1px solid #555566; background-color:#2c2c3c; color:#dddddd; font-family:'Orbitron', sans-serif;">
        <option value="">Selecteer eerste melding</option>
    </select>
    <select id="compare-mission-2" style="padding:6px 10px; border-radius:6px; border:1px solid #555566; background-color:#2c2c3c; color:#dddddd; font-family:'Orbitron', sans-serif;">
        <option value="">Selecteer tweede melding</option>
    </select>
    <button class="button" id="compare-button">Vergelijk</button>
    <button class="button" id="clear-compare">Wis selectie</button>
</div>

<div id="compare-result" style="margin:20px; text-align:center;"></div>

<div class="table-wrapper">
    <div id="sheet-data"></div>
</div>

<div id="exportModal">
    <div class="modal-content">
        <h2 style="color:#eeeeee; margin-top:0; font-family:'Orbitron', sans-serif; font-size: 20px;">Filter Categorieën</h2>
        <p style="font-size:13px; margin-bottom:15px;">Vink de types aan die je wilt opnemen in de export.</p>
        
        <div id="category-list" class="category-grid">
            </div>

        <div style="display:flex; gap:10px; justify-content:flex-end; border-top: 1px solid #444; pt-15px; margin-top:10px;">
            <button class="button" onclick="closeExportModal()">Annuleren</button>
            <button class="button" onclick="processCategoryExport()" style="background-color:#2e7d32;">Exporteer naar Excel</button>
        </div>
    </div>
</div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
let missions = [];
const dataFile = 'nl_NL-Data/einsaetze.json';
const translationsFile = 'translations.json';
const lastUpdateFile = 'nl_NL-Data/last_update.txt';

const pageTranslations = {
    nl: {
        title: "Melding IDs",
        message: "Overzicht van alle meldingen in Meldkamerspel (NL).",
        gameButton: "Startpagina",
        contactButton: "Contact",
        backButton: "Terug",
        searchPlaceholder: "Melding zoeken...",
        lastUpdate: "Laatste update",
        swipeHint: "← swipe naar links of rechts om de tabel te bekijken →",
        tableHeaders: ["ID", "Naam", "POI", "Gemiddelde Credits", "Benodigdheden"],
        toggle: { show: "Toon Benodigdheden", hide: "Verberg Benodigdheden" },
        unknown: "Onbekend"
    },
    de: {
        title: "Einsätze IDs",
        message: "Hier finden Sie eine Übersicht aller Einsätze (NL).",
        gameButton: "Startseite",
        contactButton: "Kontakt",
        backButton: "Zurück",
        searchPlaceholder: "Einsätze suchen...",
        lastUpdate: "Letzte Aktualisierung",
        swipeHint: "← nach links oder rechts wischen, um die Tabelle zu sehen →",
        tableHeaders: ["ID", "Name", "POI", "Durchschnittliche Credits", "Benötigte Fahrzeuge"],
        toggle: { show: "Fahrzeuge anzeigen", hide: "Fahrzeuge verbergen" },
        unknown: "Unbekannt"
    },
    en: {
        title: "Mission IDs",
        message: "Here you can find an overview of all missions (NL).",
        gameButton: "Homepage",
        contactButton: "Contact",
        backButton: "Back",
        searchPlaceholder: "Search mission...",
        lastUpdate: "Last update",
        swipeHint: "← swipe left or right to view the table →",
        tableHeaders: ["ID", "Name", "POI", "Average Credits", "Requirements"],
        toggle: { show: "Show Requirements", hide: "Hide Requirements" },
        unknown: "Unknown"
    }
};

let currentLang = 'nl';
let translations = {};

async function loadTranslations() {
    try {
        const response = await fetch(translationsFile);
        translations = await response.json();
    } catch (error) {
        console.error("Fout bij het laden van vertalingen:", error);
    }
}

async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const date = new Date((await res.text()).trim());
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: ${date.toLocaleString()}`;
    } catch {
        document.getElementById('last-update').textContent =
            `${pageTranslations[currentLang].lastUpdate}: onbekend`;
    }
}

function formatRequirements(req, categories, mission) {
    let html = '';
    const isAmbulance = (categories || []).includes('ambulance');
    const medicalBlock = buildMedicalBlock(mission);

    if (categories && categories.length > 0) {
        html += `<strong>${translations.mission_categories || 'Meldingscategorie'}</strong><br>`;
        html += categories.map(cat => {
            const catKey = 'cat_' + cat;
            return translations[catKey] || translations[cat] || cat;
        }).join(', ') + '<br><br>';
    }

    if (isAmbulance && medicalBlock) {
        html += medicalBlock + '<br>';
    }

    if (req && Object.keys(req).length > 0) {
        const vehicleHtml = Object.entries(req).map(([k, v]) => {
            if (typeof v === 'object' && v !== null) {
                return Object.entries(v)
                    .map(([subK, subV]) =>
                        `${translations[k] || k}: ${subV}x ${translations[subK] || subK}`
                    )
                    .join('<br>');
            }
            return `${translations[k] || k}: ${v}`;
        }).join('<br>');

        if (vehicleHtml) {
            html += vehicleHtml + '<br>';
        }
    }

    if (!isAmbulance && medicalBlock) {
        if (req && Object.keys(req).length > 0) html += '<br>';
        html += medicalBlock;
    }

    return html || '-';
}

async function initMissions() {
    missions = await (await fetch(dataFile)).json();
    await loadTranslations();

    const container = document.getElementById('sheet-data');
    container.innerHTML = '';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');

    pageTranslations[currentLang].tableHeaders.forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        tr.appendChild(th);
    });

    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    missions.forEach(m => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${m.id}</td>
            <td>${m.name}</td>
            <td>${(m.place_array || []).join(', ')}</td>
            <td>${m.average_credits ?? (pageTranslations[currentLang].unknown || 'Onbekend')}</td>
            <td><button class="button-toggle">${pageTranslations[currentLang].toggle.show}</button></td>
        `;
        tbody.appendChild(row);

        const reqRow = document.createElement('tr');
        reqRow.className = 'requirements-row';
        const td = document.createElement('td');
        td.colSpan = 5;

        const div = document.createElement('div');
        div.className = 'requirements-content';
        div.innerHTML = formatRequirements(m.requirements, m.mission_categories, m);

        td.appendChild(div);
        reqRow.appendChild(td);
        tbody.appendChild(reqRow);

        const toggleBtn = row.querySelector('.button-toggle');
        toggleBtn.onclick = () => {
            const open = div.classList.toggle('show');
            div.style.maxHeight = open ? div.scrollHeight + 'px' : null;
            toggleBtn.textContent = open
                ? pageTranslations[currentLang].toggle.hide
                : pageTranslations[currentLang].toggle.show;
        };
    });

    table.appendChild(tbody);
    container.appendChild(table);

    const select1 = document.getElementById('compare-mission-1');
    const select2 = document.getElementById('compare-mission-2');
    select1.innerHTML = '<option value="">Selecteer eerste melding</option>';
    select2.innerHTML = '<option value="">Selecteer tweede melding</option>';

    missions.forEach(m => {
        const option1 = document.createElement('option');
        option1.value = m.id;
        option1.textContent = `${m.id} - ${m.name}`;
        select1.appendChild(option1);

        const option2 = document.createElement('option');
        option2.value = m.id;
        option2.textContent = `${m.id} - ${m.name}`;
        select2.appendChild(option2);
    });
}

function buildMedicalBlock(mission) {
    if (!mission) return '';
    const chances = mission.chances;
    const add = mission.additional;
    let html = '';
    let hasContent = false;

    let chanceHtml = '';
    if (chances && Object.keys(chances).length > 0) {
        for (const [key, value] of Object.entries(chances)) {
            let label = translations[key] || key;
            label = label.replace('Benodigde ', ''); 
            chanceHtml += `• ${label}: ${value}%<br>`;
        }
    }

    if (chanceHtml) {
        html += `<strong>${translations.chances || 'Kansen'}</strong><br>`;
        html += chanceHtml + '<br>';
        hasContent = true;
    }

    let addHtml = '';
    if (add) {
        if (add.possible_patient !== undefined || add.possible_patient_min !== undefined || add.patient_specialization_captions?.length) {
            if (add.possible_patient !== undefined) addHtml += `• ${translations.possible_patient || 'Mogelijke patiënten'}: ${add.possible_patient}<br>`;
            if (add.possible_patient_min !== undefined) addHtml += `• ${translations.possible_patient_min || 'Min. patiënten'}: ${add.possible_patient_min}<br>`;
            if (add.patient_transport !== undefined) addHtml += `• ${translations.patient_transport || 'Patiëntenvervoer'}: ${add.patient_transport}%<br>`;
            if (add.patient_specialization_captions?.length) addHtml += `• ${translations.patient_specializations || 'Specialisaties'}: ${add.patient_specialization_captions.join(', ')}<br>`;
        }
    }

    if (addHtml) {
        html += `<strong>${translations.patient_info || 'Patiënt info'}</strong><br>`;
        html += addHtml;
        hasContent = true;
    }
    return hasContent ? html : '';
}

// =========================
// EXPORT LOGICA
// =========================
function openExportModal() {
    const modal = document.getElementById('exportModal');
    const list = document.getElementById('category-list');
    list.innerHTML = ''; 

    const allCats = new Set();
    missions.forEach(m => {
        if (m.mission_categories) {
            m.mission_categories.forEach(c => allCats.add(c));
        }
    });

    Array.from(allCats).sort().forEach(cat => {
        const labelText = translations['cat_' + cat] || translations[cat] || cat;
        list.innerHTML += `
            <label class="category-item">
                <input type="checkbox" value="${cat}" class="cat-checkbox"> ${labelText}
            </label>
        `;
    });

    modal.style.display = 'flex';
}

function closeExportModal() {
    document.getElementById('exportModal').style.display = 'none';
}

function processCategoryExport() {
    const selectedCats = Array.from(document.querySelectorAll('.cat-checkbox:checked')).map(cb => cb.value);
    if (selectedCats.length === 0) return alert("Selecteer minimaal één categorie.");

    const filteredData = missions.filter(m => 
        m.mission_categories && m.mission_categories.some(c => selectedCats.includes(c))
    );
    generateXlsx(filteredData, "Meldkamerspel_Selectie");
    closeExportModal();
}

function exportAllToExcel() {
    generateXlsx(missions, "Meldkamerspel_Alle_Meldingen");
}

function generateXlsx(dataArray, fileName) {
    const dataToExport = dataArray.map(m => {
        const rawReqs = formatRequirements(m.requirements, m.mission_categories, m);
        const cleanReqs = rawReqs.replace(/<br>/g, '\n').replace(/<\/?[^>]+(>|$)/g, "");

        return {
            "ID": m.id,
            "Naam": m.name,
            "Categorieën": (m.mission_categories || []).map(cat => translations['cat_' + cat] || translations[cat] || cat).join(', '),
            "Locatie (POI)": (m.place_array || []).join(', '),
            "Credits": m.average_credits || 'Onbekend',
            "Benodigdheden & Info": cleanReqs
        };
    });

    const worksheet = XLSX.utils.json_to_sheet(dataToExport);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Meldingen");
    
    worksheet['!cols'] = [{wch:10}, {wch:45}, {wch:35}, {wch:25}, {wch:15}, {wch:70}];
    XLSX.writeFile(workbook, `${fileName}.xlsx`);
}

function changeLanguage(lang) {
    currentLang = lang;
    const t = pageTranslations[lang];
    document.title = t.title;
    document.getElementById('page-title').textContent = t.title;
    document.getElementById('page-message').textContent = t.message;
    document.getElementById('game-button').textContent = t.gameButton;
    document.getElementById('contact-button').textContent = t.contactButton;
    document.getElementById('back-button').textContent = t.backButton;
    document.getElementById('swipe-hint').textContent = t.swipeHint;
    document.getElementById('mission-search').placeholder = t.searchPlaceholder;
    loadLastUpdate();
    initMissions();
}

document.addEventListener('input', function(e) {
    if (e.target.id !== 'mission-search') return;
    const search = e.target.value.toLowerCase();
    const rows = document.querySelectorAll('#sheet-data table tbody tr');
    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (row.classList.contains('requirements-row')) continue;
        const text = row.textContent.toLowerCase();
        const show = text.includes(search);
        row.style.display = show ? '' : 'none';
        const nextRow = row.nextElementSibling;
        if (nextRow && nextRow.classList.contains('requirements-row')) nextRow.style.display = show ? '' : 'none';
    }
});

document.getElementById('clear-compare').addEventListener('click', () => {
    document.getElementById('compare-mission-1').value = '';
    document.getElementById('compare-mission-2').value = '';
    document.getElementById('compare-result').innerHTML = '';
});
    
document.getElementById('compare-button').addEventListener('click', () => {
    const id1 = document.getElementById('compare-mission-1').value;
    const id2 = document.getElementById('compare-mission-2').value;
    if (!id1 || !id2) return alert('Selecteer beide meldingen.');
    if (id1 === id2) return alert('Selecteer twee verschillende meldingen.');
    const m1 = missions.find(m => m.id == id1);
    const m2 = missions.find(m => m.id == id2);
    const resultDiv = document.getElementById('compare-result');
    resultDiv.innerHTML = `
        <table style="margin:0 auto; min-width:700px; border-collapse:collapse; background-color:#2a2a3a; border-radius:10px;">
            <thead>
                <tr><th>Eigenschap</th><th>${m1.name} (${m1.id})</th><th>${m2.name} (${m2.id})</th></tr>
            </thead>
            <tbody>
                <tr><td>ID</td><td>${m1.id}</td><td>${m2.id}</td></tr>
                <tr><td>Naam</td><td>${m1.name}</td><td>${m2.name}</td></tr>
                <tr><td>POI</td><td>${(m1.place_array||[]).join(', ')}</td><td>${(m2.place_array||[]).join(', ')}</td></tr>
                <tr><td>Credits</td><td>${m1.average_credits}</td><td>${m2.average_credits}</td></tr>
                <tr><td>Benodigdheden</td><td>${formatRequirements(m1.requirements, m1.mission_categories, m1)}</td><td>${formatRequirements(m2.requirements, m2.mission_categories, m2)}</td></tr>
            </tbody>
        </table>
    `;
});

document.getElementById('footer-year').textContent = new Date().getFullYear();
window.addEventListener('DOMContentLoaded', () => changeLanguage(currentLang));
</script>

</body>
</html>
