<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meldingen Meldkamerspel (nl_NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #0e0e1a;
    color: #00ffe0;
    text-align: center;
}

h1 {
    margin: 30px 0 10px;
    font-size: 32px;
    text-shadow: 0 0 5px #00ffe0;
}

p {
    max-width: 800px;
    margin: 0 auto 10px;
    font-size: 15px;
}

#last-update {
    font-size: 13px;
    color: #8fffee;
    margin-bottom: 20px;
}

table {
    width: 95%;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #1f1f2e;
    color: #00ffe0;
    box-shadow: 0 0 10px #00ffe0;
    border-radius: 10px;
    overflow: hidden;
}

        .language-selector {
            list-style: none;
            display: flex;
            justify-content: center;
            margin-top: 20px;
            padding: 0;
            gap: 10px;
        }

        .language-selector li img {
            width: 30px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .language-selector li img:hover {
            transform: scale(1.1);
        }

thead th {
    background-color: #2e2e3e;
    padding: 12px;
    border-bottom: 2px solid #00ffe0;
}

tbody td {
    padding: 10px;
    border-bottom: 1px solid #444;
    vertical-align: top;
}

tbody tr:hover {
    background-color: #2a2a3e;
}


     .button-container {
            margin: 20px 0;
        }

        .button {
            background-color: #1b1b2f;
            color: #00ffe0; /* Neon kleur voor knoppen */
            border: 2px solid #00ffe0; /* Neon kleur voor de rand van knoppen */
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 8px;
            margin: 0 5px;
            transition: background-color 0.2s, transform 0.2s;
        }

        .button:hover {
            background-color: #00ffe0; /* Neon kleur voor hover */
            color: #1b1b2f;
            transform: scale(1.05);
        }

.button-toggle {
    background-color: #1b1b2f;
    color: #00ffe0;
    border: 1px solid #00ffe0;
    padding: 6px 16px;       /* meer padding */
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    min-width: 160px;        /* breed genoeg voor "Verberg Benodigdheden" */
    white-space: nowrap;     /* voorkom regelbreking */
    transition: all 0.2s ease;
}

.button-toggle:hover {
    background-color: #00ffe0;
    color: #1b1b2f;
}
.button-toggle {
    background-color: #1b1b2f;
    color: #00ffe0;
    border: 1px solid #00ffe0;
    padding: 6px 16px;       /* meer padding */
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    min-width: 160px;        /* breed genoeg voor "Verberg Benodigdheden" */
    white-space: nowrap;     /* voorkom regelbreking */
    transition: all 0.2s ease;
}

.button-toggle:hover {
    background-color: #00ffe0;
    color: #1b1b2f;
}



.requirements-row td {
    background-color: #222233;
    padding: 10px 20px;
    text-align: left;
    font-size: 14px;
}

.requirements-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease;
    opacity: 0;
}

.requirements-content.show {
    opacity: 1;
}

#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #ccc;
}
</style>
</head>

<body>
        <ul class="language-selector">
        <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')" /></li>
        <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')" /></li>
        <li><img src="../../images/flag_uk.gif" alt="English (UK)" onclick="changeLanguage('en-uk')" /></li>
        <li><img src="../../images/flag_us.gif" alt="English (US)" onclick="changeLanguage('en-us')" /></li>
        <li><img src="../../images/flag_au.gif" alt="English (AU)" onclick="changeLanguage('en-au')" /></li>
        <li><a class="button" id="back-button" href="/gameversions/nl_NL/indexNL">Terug</a></li>
    </ul>

    <div class="button-container">
        <a class="button" id="game-button" href="/index">Startpagina</a>
        <a class="button" id="contact-button" href="/gameversions/contact">Contact</a>
    </div>

<h1 id="page-title">Melding IDs</h1>
<p id="page-message">Overzicht van alle meldingen in Meldkamerspel.</p>
<p id="last-update">Laatste update: laden…</p>

<div id="sheet-data"></div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const dataFile = 'nl_NL-Data/einsaetze.json';
const translationsFile = 'translations.json';
const lastUpdateFile = 'nl_NL-Data/last_update.txt';

async function loadJSON(path) {
    const res = await fetch(path);
    return await res.json();
}

async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const text = await res.text();

        const date = new Date(text.trim());
        const formatted = date.toLocaleString('nl-NL', {
            dateStyle: 'long',
            timeStyle: 'short'
        });

        document.getElementById('last-update').textContent =
            `Laatste update: ${formatted}`;
    } catch {
        document.getElementById('last-update').textContent =
            'Laatste update: onbekend';
    }
}

async function initMissions() {
    const missions = await loadJSON(dataFile);
    const translations = await loadJSON(translationsFile);

    const container = document.getElementById('sheet-data');

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');

    ['ID', 'Naam', 'POI', 'Gemiddelde Credits', 'Benodigdheden']
        .forEach(col => {
            const th = document.createElement('th');
            th.textContent = col;
            headerRow.appendChild(th);
        });

    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    missions.forEach(mission => {
        const row = document.createElement('tr');

        row.innerHTML = `
            <td>${mission.id || mission.ID || ''}</td>
            <td>${mission.name || mission.Naam || ''}</td>
            <td>${
                Array.isArray(mission.place_array)
                    ? mission.place_array.join(', ')
                    : (mission.place || '').replace(/\n+/g, ', ')
            }</td>
            <td>${mission.average_credits || mission['Gemiddelde Credits'] || ''}</td>
            <td><button class="button-toggle">Toon Benodigdheden</button></td>
        `;

        tbody.appendChild(row);

        const reqRow = document.createElement('tr');
        reqRow.className = 'requirements-row';

        const reqTd = document.createElement('td');
        reqTd.colSpan = 5;

        const reqDiv = document.createElement('div');
        reqDiv.className = 'requirements-content';

        if (mission.requirements) {
            for (const key in mission.requirements) {
                const name = translations[key] || key;
                const value = mission.requirements[key];

                if (typeof value === 'object') {
                    for (const sub in value) {
                        reqDiv.innerHTML += `${name} (${translations[sub] || sub}): ${value[sub]}<br>`;
                    }
                } else {
                    reqDiv.innerHTML += `${name}: ${value}<br>`;
                }
            }
        }

        reqTd.appendChild(reqDiv);
        reqRow.appendChild(reqTd);
        tbody.appendChild(reqRow);

        row.querySelector('button').addEventListener('click', () => {
        const isShown = reqDiv.classList.toggle('show');
        reqDiv.style.maxHeight = isShown ? reqDiv.scrollHeight + 'px' : null;

    // Pas de button tekst aan
        row.querySelector('button').textContent = isShown 
            ? 'Verberg Benodigdheden' 
            : 'Toon Benodigdheden';
    });

    });

    table.appendChild(tbody);
    container.appendChild(table);
}
const translationsText = {
    last_update: {
        nl: "Laatste update",
        de: "Letzte Aktualisierung",
        "en-uk": "Last update",
        "en-us": "Last update",
        "en-au": "Last update"
    }
};



    
let currentLanguage = 'nl'; // standaard taal

function changeLanguage(lang) {
    currentLanguage = lang; // sla de taal op voor andere functies
    const lastUpdateElement = document.getElementById('last-update');

    switch(lang) {
        case "nl":
            document.title = "Melding IDs";
            document.getElementById('page-title').textContent = "Melding IDs";
            document.getElementById('page-message').textContent = "Hier kunt u een overzicht vinden van alle meldingen in Meldkamerspel.";
            document.getElementById('game-button').textContent = "Startpagina";
            document.getElementById('contact-button').textContent = "Contact";
            document.getElementById('back-button').textContent = "Terug";
            lastUpdateElement.dataset.label = "Laatste update";
            break;
        case "de":
            document.title = "Einsätze IDs";
            document.getElementById('page-title').textContent = "Einsätze IDs";
            document.getElementById('page-message').textContent = "Hier finden Sie eine Übersicht aller Einsätze in Leitstellenspiel.";
            document.getElementById('game-button').textContent = "Startseite";
            document.getElementById('contact-button').textContent = "Kontakt";
            document.getElementById('back-button').textContent = "Zurück";
            lastUpdateElement.dataset.label = "Letzte Aktualisierung";
            break;
        default: // Engels
            document.title = "Mission IDs";
            document.getElementById('page-title').textContent = "Mission IDs";
            document.getElementById('page-message').textContent = "Here you can find an overview of all missions in Missionchief.";
            document.getElementById('game-button').textContent = "Homepage";
            document.getElementById('contact-button').textContent = "Contact";
            document.getElementById('back-button').textContent = "Back";
            lastUpdateElement.dataset.label = "Last update";
            break;
    }

    // herlaad de tekst van last-update als deze al geladen is
    if (lastUpdateElement.dataset.rawDate) {
        formatLastUpdate(lastUpdateElement.dataset.rawDate);
    }
}

let lastUpdateDate = null; // globaal opslaan

async function loadLastUpdate() {
    try {
        const res = await fetch(lastUpdateFile);
        const text = await res.text();
        lastUpdateDate = new Date(text.trim()); // opslaan
        updateLastUpdateText('nl'); // standaard taal
    } catch {
        document.getElementById('last-update').textContent = 'Laatste update: onbekend';
    }
}

// functie om de tekst te updaten afhankelijk van taal
function updateLastUpdateText(lang) {
    if (!lastUpdateDate) return;

    const formatted = lastUpdateDate.toLocaleString('nl-NL', {
        dateStyle: 'long',
        timeStyle: 'short'
    });

    let prefix;
    switch(lang) {
        case 'nl':
            prefix = 'Laatste update';
            break;
        case 'de':
            prefix = 'Letzte Aktualisierung';
            break;
        default:
            prefix = 'Last update';
            break;
    }

    document.getElementById('last-update').textContent = `${prefix}: ${formatted}`;
}


function formatLastUpdate(isoDate) {
    const date = new Date(isoDate);
    const lastUpdateElement = document.getElementById('last-update');

    let formatted;
    switch(currentLanguage) {
        case 'nl':
            formatted = date.toLocaleString('nl-NL', { dateStyle: 'long', timeStyle: 'short' });
            break;
        case 'de':
            formatted = date.toLocaleString('de-DE', { dateStyle: 'long', timeStyle: 'short' });
            break;
        default:
            formatted = date.toLocaleString('en-US', { dateStyle: 'long', timeStyle: 'short' });
            break;
    }

    lastUpdateElement.textContent = `${lastUpdateElement.dataset.label}: ${formatted}`;
}




    
const startYear = 2024;
const currentYear = new Date().getFullYear();
document.getElementById('footer-year').textContent =
    startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

loadLastUpdate();
initMissions();
</script>

</body>
</html>
