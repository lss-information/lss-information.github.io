<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meldingen Meldkamerspel (nl_NL)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            background-color: #0e0e1a;
            color: #00ffe0;
            text-align: center;
        }
        h1 {
            margin: 30px 0 10px;
            font-size: 32px;
            text-shadow: 0 0 5px #00ffe0;
        }
        p {
            max-width: 800px;
            margin: 0 auto 20px;
            font-size: 15px;
        }
        .language-selector {
            list-style: none;
            display: flex;
            justify-content: center;
            margin-top: 20px;
            padding: 0;
            gap: 10px;
        }
        .language-selector li img {
            width: 30px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .language-selector li img:hover {
            transform: scale(1.1);
        }
        .button-container {
            margin: 20px 0;
        }
        .button {
            background-color: #1b1b2f;
            color: #00ffe0;
            border: 2px solid #00ffe0;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 8px;
            margin: 0 5px;
            transition: background-color 0.2s, transform 0.2s;
        }
        .button:hover {
            background-color: #00ffe0;
            color: #1b1b2f;
            transform: scale(1.05);
        }
        table {
            width: 95%;
            max-width: 1200px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #1f1f2e;
            color: #00ffe0;
            box-shadow: 0 0 10px #00ffe0;
            border-radius: 10px;
            overflow: hidden;
        }
        thead th {
            background-color: #2e2e3e;
            padding: 12px;
            border-bottom: 2px solid #00ffe0;
        }
        tbody td {
            padding: 10px;
            border-bottom: 1px solid #444;
            vertical-align: top;
        }
        tbody tr:hover {
            background-color: #2a2a3e;
        }
        .requirements {
            text-align: left;
            margin-top: 5px;
            font-size: 14px;
        }
        #footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <ul class="language-selector">
        <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')" /></li>
        <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')" /></li>
        <li><img src="../../images/flag_uk.gif" alt="English (UK)" onclick="changeLanguage('en-uk')" /></li>
        <li><img src="../../images/flag_us.gif" alt="English (US)" onclick="changeLanguage('en-us')" /></li>
        <li><img src="../../images/flag_au.gif" alt="English (AU)" onclick="changeLanguage('en-au')" /></li>
        <li><a class="button" id="back-button" href="/gameversions/nl_NL/indexNL">Terug</a></li>
    </ul>

    <div class="button-container">
        <a class="button" id="game-button" href="/index">Startpagina</a>
        <a class="button" id="contact-button" href="/gameversions/contact">Contact</a>
    </div>

    <h1 id="page-title">Melding IDs</h1>
    <p id="page-message">Hier kunt u een overzicht vinden van alle meldingen in Meldkamerspel. Het laden kan enkele seconden duren. Wijzigingen? Klik op Contact.</p>

    <div id="sheet-data"></div>

    <footer id="footer">
        &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
    </footer>

    <script>
        const translationsFile = 'translations.json';
        const dataFile = 'nl_NL-Data/einsaetze.json';

        async function loadJSON(path) {
            const res = await fetch(path);
            return await res.json();
        }

        async function initMissions() {
            const missions = await loadJSON(dataFile);
            const translations = await loadJSON(translationsFile);

            const container = document.getElementById('sheet-data');

            const table = document.createElement('table');

            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            ['ID', 'Naam', 'POI', 'Gemiddelde Credits'].forEach(col => {
                const th = document.createElement('th');
                th.textContent = col;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');

            missions.forEach(mission => {
                const row = document.createElement('tr');

                ['ID', 'Naam', 'POI', 'Gemiddelde Credits'].forEach(col => {
                    const td = document.createElement('td');
                    td.textContent = mission[col] || '';
                    row.appendChild(td);
                });
                tbody.appendChild(row);

                // Benodigdheden onder de hele melding
                const reqRow = document.createElement('tr');
                const reqTd = document.createElement('td');
                reqTd.colSpan = 4;
                const reqDiv = document.createElement('div');
                reqDiv.className = 'requirements';
                reqDiv.innerHTML = '<strong>Benodigdheden:</strong><br>';

                // requirements
                if (mission.requirements) {
                    for (const key in mission.requirements) {
                        const name = translations[key] || key;
                        reqDiv.innerHTML += `${name}: ${mission.requirements[key]}<br>`;
                    }
                }

                // chances
                if (mission.chances) {
                    for (const key in mission.chances) {
                        const name = translations[key] || key;
                        reqDiv.innerHTML += `${name} - kans: ${mission.chances[key]} %<br>`;
                    }
                }

                reqTd.appendChild(reqDiv);
                reqRow.appendChild(reqTd);
                tbody.appendChild(reqRow);
            });

            table.appendChild(tbody);
            container.appendChild(table);
        }

        initMissions();

        // Footer jaar
        const startYear = 2024;
        const currentYear = new Date().getFullYear();
        document.getElementById('footer-year').textContent = startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

        function changeLanguage(lang) {
            switch(lang) {
                case "nl":
                    document.title = "Melding IDs";
                    document.getElementById('page-title').textContent = "Melding IDs";
                    document.getElementById('page-message').textContent = "Hier kunt u een overzicht vinden van alle meldingen in Meldkamerspel. Het laden kan enkele seconden duren. Wijzigingen? Klik op Contact.";
                    document.getElementById('game-button').textContent = "Startpagina";
                    document.getElementById('contact-button').textContent = "Contact";
                    document.getElementById('back-button').textContent = "Terug";
                    break;
                case "de":
                    document.title = "Einsätze IDs";
                    document.getElementById('page-title').textContent = "Einsätze IDs";
                    document.getElementById('page-message').textContent = "Hier finden Sie eine Übersicht aller Einsätze in Leitstellenspiel.";
                    document.getElementById('game-button').textContent = "Startseite";
                    document.getElementById('contact-button').textContent = "Kontakt";
                    document.getElementById('back-button').textContent = "Zurück";
                    break;
                default:
                    document.title = "Mission IDs";
                    document.getElementById('page-title').textContent = "Mission IDs";
                    document.getElementById('page-message').textContent = "Here you can find an overview of all missions in Missionchief.";
                    document.getElementById('game-button').textContent = "Homepage";
                    document.getElementById('contact-button').textContent = "Contact";
                    document.getElementById('back-button').textContent = "Back";
                    break;
            }
        }
    </script>
</body>
</html>
