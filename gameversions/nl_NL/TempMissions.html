<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meldingen Meldkamerspel (nl_NL)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            background-color: #0e0e1a;
            color: #00ffe0;
            text-align: center;
        }

        h1 {
            margin: 30px 0 10px;
            font-size: 32px;
            text-shadow: 0 0 5px #00ffe0;
        }

        .language-selector {
            list-style: none;
            display: flex;
            justify-content: center;
            margin-top: 20px;
            padding: 0;
            gap: 10px;
        }

        .language-selector li img {
            width: 30px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .language-selector li img:hover {
            transform: scale(1.1);
        }

        .button-container {
            margin: 20px 0;
        }

        .button {
            background-color: #1b1b2f;
            color: #00ffe0;
            border: 2px solid #00ffe0;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 8px;
            margin: 0 5px;
            transition: background-color 0.2s, transform 0.2s;
        }

        .button:hover {
            background-color: #00ffe0;
            color: #1b1b2f;
            transform: scale(1.05);
        }

        table {
            width: 95%;
            max-width: 1200px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #1f1f2e;
            color: #00ffe0;
            box-shadow: 0 0 10px #00ffe0;
            border-radius: 10px;
            overflow: hidden;
        }

        thead th {
            background-color: #2e2e3e;
            padding: 12px;
            border-bottom: 2px solid #00ffe0;
        }

        tbody td {
            padding: 10px;
            border-bottom: 1px solid #444;
        }

        tbody tr:hover {
            background-color: #2a2a3e;
        }

        #footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <ul class="language-selector">
        <li><img src="../../images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')" /></li>
        <li><img src="../../images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')" /></li>
        <li><img src="../../images/flag_uk.gif" alt="English (UK)" onclick="changeLanguage('en-uk')" /></li>
        <li><img src="../../images/flag_us.gif" alt="English (US)" onclick="changeLanguage('en-us')" /></li>
        <li><img src="../../images/flag_au.gif" alt="English (AU)" onclick="changeLanguage('en-au')" /></li>
        <li><a class="button" id="back-button" href="/gameversions/nl_NL/indexNL">Terug</a></li>
    </ul>

    <div class="button-container">
        <a class="button" id="game-button" href="/index">Startpagina</a>
        <a class="button" id="contact-button" href="/gameversions/contact">Contact</a>
    </div>

    <h1 id="page-title">Melding IDs</h1>
    <p id="page-message">Hier kunt u een overzicht vinden van alle meldingen in Meldkamerspel. Het laden kan enkele seconden duren. Wijzigingen? Klik op Contact.</p>

    <div id="json-table"></div>

    <footer id="footer">
        &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
    </footer>

    <script>
        // Laad de JSON lokaal
        async function loadJSON() {
            const response = await fetch('nl_NL-Data/einsaetze.json');
            const data = await response.json();

            renderTable(data);
        }

        function renderTable(data) {
            const container = document.getElementById('json-table');
            container.innerHTML = '';

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');

            const columns = ["ID", "Naam", "POI", "Gemiddelde Credits"];
            columns.forEach(col => {
                const th = document.createElement('th');
                th.textContent = col;
                headerRow.appendChild(th);
            });

            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.ID || item.id}</td>
                    <td>${item.Naam || item.name}</td>
                    <td>${item.POI || item.place}</td>
                    <td>${item["Gemiddelde Credits"] || item.average_credits}</td>
                `;
                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            container.appendChild(table);
        }

        // Taalselectie
        function changeLanguage(lang) {
            let headers;
            switch(lang) {
                case "nl":
                    document.title = "Melding IDs";
                    document.getElementById('page-title').textContent = "Melding IDs";
                    document.getElementById('page-message').textContent = "Hier kunt u een overzicht vinden van alle meldingen in Meldkamerspel. Het laden kan enkele seconden duren. Wijzigingen? Klik op Contact.";
                    document.getElementById('game-button').textContent = "Startpagina";
                    document.getElementById('contact-button').textContent = "Contact";
                    document.getElementById('back-button').textContent = "Terug";
                    headers = ["ID", "Naam", "POI", "Gemiddelde Credits"];
                    break;
                case "de":
                    document.title = "Einsätze IDs";
                    document.getElementById('page-title').textContent = "Einsätze IDs";
                    document.getElementById('page-message').textContent = "Hier finden Sie eine Übersicht aller Einsätze in Leitstellenspiel.";
                    document.getElementById('game-button').textContent = "Startseite";
                    document.getElementById('contact-button').textContent = "Kontakt";
                    document.getElementById('back-button').textContent = "Zurück";
                    headers = ["ID", "Name", "POI", "Durchschnitt Credits"];
                    break;
                default:
                    document.title = "Mission IDs";
                    document.getElementById('page-title').textContent = "Mission IDs";
                    document.getElementById('page-message').textContent = "Here you can find an overview of all missions in Missionchief.";
                    document.getElementById('game-button').textContent = "Homepage";
                    document.getElementById('contact-button').textContent = "Contact";
                    document.getElementById('back-button').textContent = "Back";
                    headers = ["ID", "Name", "POI", "Average Credits"];
                    break;
            }

            // Update table headers
            const ths = document.querySelectorAll('#json-table thead th');
            ths.forEach((th, i) => th.textContent = headers[i]);
        }

        // Footer jaar
        const startYear = 2024;
        const currentYear = new Date().getFullYear();
        document.getElementById('footer-year').textContent = startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

        // Start
        loadJSON();
    </script>
</body>
</html>
