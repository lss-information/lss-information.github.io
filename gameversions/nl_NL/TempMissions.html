<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meldingen Meldkamerspel (nl_NL)</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #0e0e1a;
    color: #00ffe0;
    text-align: center;
}
h1 {
    margin: 30px 0 10px;
    font-size: 32px;
    text-shadow: 0 0 5px #00ffe0;
}
.mission {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid #444;
    transition: background-color 0.2s;
}
.mission:hover {
    background-color: #2a2a3e;
}
.mission-info {
    display: flex;
    gap: 20px;
    align-items: center;
}
.toggle-btn {
    cursor: pointer;
    color: #00ffe0;
    background-color: #1b1b2f;
    border: 2px solid #00ffe0;
    padding: 5px 10px;
    border-radius: 5px;
    transition: all 0.2s;
}
.toggle-btn:hover {
    background-color: #00ffe0;
    color: #1b1b2f;
}
.req-container {
    display: none;
    background-color: #222233;
    padding: 10px 20px;
    margin: 0;
    transition: all 0.3s ease;
}
.req-container div {
    margin: 3px 0;
}
#footer {
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #ccc;
}
</style>
</head>
<body>

<h1>Meldingen Meldkamerspel</h1>
<p>Hier vindt u een overzicht van alle meldingen. Klik op "Benodigdheden" om de details te zien.</p>

<div id="missions-container"></div>

<footer id="footer">
    &copy; <span id="footer-year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
async function loadMissions() {
    const missionsResp = await fetch('nl_NL-Data/einsaetze.json');
    const missions = await missionsResp.json();

    const translationsResp = await fetch('translations.json');
    const translations = await translationsResp.json();

    const container = document.getElementById('missions-container');

    const translationOrder = Object.keys(translations);

    missions.forEach(mission => {
        // Mission wrapper
        const missionDiv = document.createElement('div');
        missionDiv.className = 'mission';

        // Mission info
        const infoDiv = document.createElement('div');
        infoDiv.className = 'mission-info';
        infoDiv.innerHTML = `<div><strong>ID:</strong> ${mission.ID || mission.id || ''}</div>
                             <div><strong>Naam:</strong> ${mission.Naam || mission.name || ''}</div>
                             <div><strong>POI:</strong> ${mission.POI || mission.place || ''}</div>`;
        missionDiv.appendChild(infoDiv);

        // Button
        const btn = document.createElement('div');
        btn.textContent = "Benodigdheden";
        btn.className = "toggle-btn";
        missionDiv.appendChild(btn);

        // Requirements + Chances container
        const reqContainer = document.createElement('div');
        reqContainer.className = 'req-container';

        const allReqs = {};

        if (mission.requirements) {
            Object.assign(allReqs, mission.requirements);
        }
        if (mission.chances) {
            Object.keys(mission.chances).forEach(k => {
                allReqs[k] = mission.chances[k] + " %";
            });
        }

        // Sorteren op volgorde translations.json
        translationOrder.forEach(key => {
            if (allReqs[key] !== undefined) {
                reqContainer.innerHTML += `<div>${translations[key]}: ${allReqs[key]}</div>`;
                delete allReqs[key];
            }
        });

        // Overige keys achteraan
        Object.keys(allReqs).forEach(k => {
            reqContainer.innerHTML += `<div>${k}: ${allReqs[k]}</div>`;
        });

        // Voeg reqContainer toe onder de missie
        container.appendChild(missionDiv);
        container.appendChild(reqContainer);

        // Toggle functie
        btn.addEventListener('click', () => {
            if (reqContainer.style.display === 'block') {
                reqContainer.style.display = 'none';
            } else {
                reqContainer.style.display = 'block';
            }
        });
    });
}

// Footer jaar
const startYear = 2024;
const currentYear = new Date().getFullYear();
document.getElementById('footer-year').textContent = startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

loadMissions();
</script>

</body>
</html>
