<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.4, maximum-scale=1.0">
<title>Meldingen Meldkamerspel (NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28; 
    color: #dddddd; 
    text-align: center;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 95%;
    min-width: 600px;
    max-width: 1200px;
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #2a2a3a; 
    border-radius: 10px;
}

thead th {
    background-color: #3a3a4a;
    padding: 12px;
    border-bottom: 2px solid #555566;
    color: #eeeeee;
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
}

tbody td {
    padding: 12px;
    border-bottom: 1px solid #444455;
    color: #dddddd;
    font-family: 'Roboto', sans-serif;
    font-size: 18px;
}

tbody tr:hover {
    background-color: #3c3c4c;
}

.button-toggle {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 1px solid #555566;
    padding: 6px 16px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    margin-top: 5px;
}

.requirements-row td {
    background-color: #262632;
    text-align: left;
    font-size: 17px;
    color: #cccccc;
    font-family: 'Roboto', sans-serif;
}

.requirements-content {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
    padding: 0 8px;
    font-family: 'Roboto', sans-serif;
    font-size: 17px;
    line-height: 1.5;
}

.requirements-content.show {
    opacity: 1;
    padding: 6px 8px;
}
</style>
</head>

<body>

<div class="table-wrapper">
    <div id="sheet-data"></div>
</div>

<script>
const eventsFile = 'nl_NL-Data/alliance_event_types.json';
const einsaetzeFile = 'nl_NL-Data/einsaetze.json';

async function initMissions() {
    const events = await (await fetch(eventsFile)).json();
    const einsaetze = await (await fetch(einsaetzeFile)).json();

    // Map van ID → naam van einsaetze
    const einsaetzeMap = {};
    einsaetze.forEach(e => { einsaetzeMap[e.id] = e.name; });

    const container = document.getElementById('sheet-data');
    container.innerHTML = '';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const trHead = document.createElement('tr');
    ['ID', 'Naam'].forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        trHead.appendChild(th);
    });
    thead.appendChild(trHead);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    events.forEach(ev => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${ev.id}</td>
            <td>${ev.caption}</td>
        `;
        tbody.appendChild(row);

        // Requirements / Mission Types dropdown row
        const reqRow = document.createElement('tr');
        reqRow.className = 'requirements-row';
        const td = document.createElement('td');
        td.colSpan = 2;

        const div = document.createElement('div');
        div.className = 'requirements-content';

        // Mission Types
        if(ev.mission_type_ids && ev.mission_type_ids.length > 0) {
            div.innerHTML += '<b>Mission Types:</b> ';
            div.innerHTML += ev.mission_type_ids.map(id => {
                return einsaetzeMap[id] ? `${id} - ${einsaetzeMap[id]}` : id;
            }).join(', ');
            div.innerHTML += '<br>';
        }

        // Requirements
        if(ev.requirements) {
            div.innerHTML += '<b>Benodigdheden:</b><br>';
            for(const k in ev.requirements) {
                div.innerHTML += `${k}: ${ev.requirements[k]}<br>`;
            }
        }

        td.appendChild(div);
        reqRow.appendChild(td);
        tbody.appendChild(reqRow);

        // Toggle knop
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'button-toggle';
        toggleBtn.textContent = "Toon Benodigdheden";
        row.cells[1].appendChild(document.createElement('br'));
        row.cells[1].appendChild(toggleBtn);

        toggleBtn.onclick = () => {
            const open = div.classList.toggle('show');
            div.style.maxHeight = open ? div.scrollHeight + 'px' : null;
            toggleBtn.textContent = open ? "Verberg Benodigdheden" : "Toon Benodigdheden";
        };
    });

    table.appendChild(tbody);
    container.appendChild(table);
}

window.addEventListener('DOMContentLoaded', () => { initMissions(); });
</script>

</body>
</html>
