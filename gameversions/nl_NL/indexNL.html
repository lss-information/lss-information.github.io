<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.4, maximum-scale=1.0">
<title>Overzichten – Meldkamerspel (NL)</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28;
    color: #dddddd;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    text-align: center;
}

/* HEADER & FOOTER */
header, footer {
    background-color: #2a2a3a;
    padding: 20px;
    border-bottom: 2px solid #555566;
}

footer {
    border-top: 2px solid #555566;
    margin-top: auto;
    font-size: 12px;
    color: #aaaaaa;
}

/* TITLES */
h1 {
    margin: 10px 0;
    font-size: 32px;
    color: #eeeeee;
}

p {
    margin: 5px auto 0;
    font-size: 14px;
    color: #cccccc;
}

/* LANGUAGE SELECTOR */
.language-selector {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
}

.language-selector img {
    height: 24px;
    width: auto;
    cursor: pointer;
    border: 2px solid #555566;
    border-radius: 4px;
    transition: transform 0.2s;
}

.language-selector img:hover {
    transform: scale(1.1);
}

/* MAIN CARD */
main {
    padding: 40px 20px;
}

.card {
    background-color: #2a2a3a;
    border: 2px solid #555566;
    border-radius: 15px;
    padding: 30px;
    max-width: 600px;
    margin: 0 auto;
}

/* BUTTONS */
.button-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.button {
    background-color: #2c2c3c;
    color: #dddddd;
    border: 2px solid #555566;
    padding: 10px 20px;
    margin: 8px 0;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    width: 100%;
    max-width: 320px;
    transition: background-color 0.2s, transform 0.2s, color 0.2s;
}

.button:hover {
    background-color: #444456;
    color: #ffffff;
    transform: scale(1.05);
}
</style>
</head>

<body>

<header>
    <h1 id="welcome-title">Welkom</h1>
    <p id="select-info">Selecteer hieronder een knop om naar de overzichten te gaan.</p>
</header>

<ul class="language-selector">
    <li><img src="/images/flag_nl.gif" alt="Nederlands" onclick="changeLanguage('nl')"></li>
    <li><img src="/images/flag_de.gif" alt="Deutsch" onclick="changeLanguage('de')"></li>
    <li><img src="/images/flag_uk.gif" alt="English" onclick="changeLanguage('en')"></li>
    <li><img src="/images/flag_us.gif" alt="English" onclick="changeLanguage('en')"></li>
</ul>

<main>
    <div class="card">
        <div class="button-container">
            <a class="button" id="back-to-home" href="../../index">Terug naar de startpagina</a>
            <a class="button" id="building-ids" href="/gameversions/nl_NL/building_ids">Gebouw ID's</a>
            <a class="button" id="vehicle-ids" href="/gameversions/nl_NL/vehicle_ids">Voertuig ID's</a>
            <a class="button" id="mission-ids" href="/gameversions/nl_NL/mission_ids">Melding ID's</a>
            <a class="button" id="pois" href="/gameversions/nl_NL/pois">POI's</a>
        </div>
    </div>
</main>

<footer id="footer">
    &copy; <span id="year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const startYear = 2024;
const currentYear = new Date().getFullYear();
document.getElementById('year').textContent =
    startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

function changeLanguage(lang) {
    let texts = {};

    if (lang === "nl") {
        texts = {
            title: "Welkom",
            info: "Selecteer hieronder een knop om naar de overzichten te gaan.",
            home: "Terug naar de startpagina",
            building: "Gebouw ID's",
            vehicle: "Voertuig ID's",
            mission: "Melding ID's",
            pois: "POI's",
            page: "Overzichten – Meldkamerspel (NL)"
        };
    } else if (lang === "de") {
        texts = {
            title: "Willkommen",
            info: "Wählen Sie unten eine Schaltfläche, um zu den Übersichten zu gelangen.",
            home: "Zurück zur Startseite",
            building: "Gebäude-IDs",
            vehicle: "Fahrzeug-IDs",
            mission: "Einsatz-IDs",
            pois: "POIs",
            page: "Übersichten – Leitstellenspiel"
        };
    } else {
        texts = {
            title: "Welcome",
            info: "Select a button below to go to the overviews.",
            home: "Back to homepage",
            building: "Building IDs",
            vehicle: "Vehicle IDs",
            mission: "Mission IDs",
            pois: "POIs",
            page: "Overviews – Dispatch Game"
        };
    }

    document.title = texts.page;
    document.getElementById('welcome-title').textContent = texts.title;
    document.getElementById('select-info').textContent = texts.info;
    document.getElementById('back-to-home').textContent = texts.home;
    document.getElementById('building-ids').textContent = texts.building;
    document.getElementById('vehicle-ids').textContent = texts.vehicle;
    document.getElementById('mission-ids').textContent = texts.mission;
    document.getElementById('pois').textContent = texts.pois;
}
</script>

</body>
</html>
