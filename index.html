<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.4, maximum-scale=1.0">
<title>Overzichten JR04</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
/* BASE */
body {
    margin: 0;
    padding: 0;
    font-family: 'Orbitron', sans-serif;
    background-color: #1e1e28;
    color: #dddddd;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    text-align: center;
}

/* HEADER & FOOTER */
header, footer {
    background-color: #2a2a3a;
    padding: 20px;
    border-bottom: 2px solid #555566;
}

footer {
    border-top: 2px solid #555566;
    margin-top: auto;
    font-size: 12px;
    color: #aaaaaa;
}

/* TITLES */
h1 {
    margin: 10px 0;
    font-size: 32px;
    color: #eeeeee;
}

p {
    margin: 10px 0;
    color: #cccccc;
}

/* LANGUAGE SELECTOR */
.language-selector {
    list-style: none;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
    padding: 0;
}

.language-selector img {
    height: 24px;
    width: auto;
    cursor: pointer;
    border: 2px solid #555566;
    border-radius: 4px;
    transition: transform 0.2s;
}

.language-selector img:hover {
    transform: scale(1.1);
}

/* MAIN */
main {
    padding: 50px 20px;
    position: relative;
}

/* CARD */
.neon-box {
    background-color: #2a2a3a;
    border: 2px solid #555566;
    border-radius: 18px;
    padding: 45px 40px;
    max-width: 600px;
    margin: 0 auto;
}

/* BUTTON */
.button-container {
    margin-top: 25px;
}

.button {
    display: inline-block;
    background-color: #2c2c3c;
    color: #dddddd;
    border: 2px solid #555566;
    padding: 18px 26px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 18px;
    width: 100%;
    max-width: 420px;
    transition: background-color 0.2s, transform 0.2s, color 0.2s;
}

.button:hover {
    background-color: #444456;
    color: #ffffff;
    transform: scale(1.05);
}

/* SHAPES */
.shape-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
}

.shape-bg div {
    position: absolute;
    border: 2px solid #55556655;
    border-radius: 50%;
    animation: float 20s infinite linear;
}

.shape1 { width: 200px; height: 200px; top: 10%; left: 10%; }
.shape2 { width: 300px; height: 300px; bottom: 10%; right: 15%; }

@keyframes float {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
}

/* MOBILE */
@media (max-width: 600px) {
    main { padding: 20px 10px; }
    .neon-box { padding: 25px 20px; }
    .button { font-size: 16px; padding: 14px 24px; }
}
</style>
</head>

<body>

<header>
    <h1 id="welcome-title">Welkom</h1>
    <p id="select-info">Selecteer hieronder een knop om naar de overzichten te gaan.</p>
</header>

<ul class="language-selector">
    <li><img src="images/flag_nl.gif" alt="NL" onclick="changeLanguage('nl')"></li>
    <li><img src="images/flag_de.gif" alt="DE" onclick="changeLanguage('de')"></li>
    <li><img src="images/flag_uk.gif" alt="UK" onclick="changeLanguage('en-uk')"></li>
    <li><img src="images/flag_us.gif" alt="US" onclick="changeLanguage('en-us')"></li>
    <li><img src="images/flag_au.gif" alt="AU" onclick="changeLanguage('en-au')"></li>
</ul>

<main>
    <div class="shape-bg">
        <div class="shape1"></div>
        <div class="shape2"></div>
    </div>

    <div class="neon-box">
        <p>Datum: <span id="currentDate"></span></p>
        <p>Tijd: <span id="currentTime"></span></p>

        <div class="button-container">
            <a class="button" id="select-button" href="gameversions/gameversionsinfo">
                Selecteer Versie
            </a>
        </div>
    </div>
</main>

<footer id="footer">
    &copy; <span id="year"></span> JR04. Alle rechten voorbehouden.
</footer>

<script>
const startYear = 2024;
const currentYear = new Date().getFullYear();
document.getElementById('year').textContent =
    startYear === currentYear ? currentYear : `${startYear} - ${currentYear}`;

function updateDateTime() {
    const now = new Date();
    document.getElementById('currentDate').textContent = now.toLocaleDateString();
    document.getElementById('currentTime').textContent = now.toLocaleTimeString();
}
updateDateTime();
setInterval(updateDateTime, 1000);

function changeLanguage(lang) {
    switch (lang) {
        case "nl":
            document.title = "Overzichten JR04";
            welcome-title.textContent = "Welkom";
            select-info.textContent = "Selecteer hieronder een knop om naar de overzichten te gaan.";
            select-button.textContent = "Selecteer Versie";
            footer.innerHTML = `&copy; ${startYear} - ${currentYear} JR04. Alle rechten voorbehouden.`;
            break;
        case "de":
            document.title = "Übersichten JR04";
            welcome-title.textContent = "Willkommen";
            select-info.textContent = "Wählen Sie unten einen Knopf, um zu den Übersichten zu gelangen.";
            select-button.textContent = "Spielversion wählen";
            footer.innerHTML = `&copy; ${startYear} - ${currentYear} JR04. Alle Rechte vorbehalten.`;
            break;
        default:
            document.title = "Overviews JR04";
            welcome-title.textContent = "Welcome";
            select-info.textContent = "Select a button below to go to the overviews.";
            select-button.textContent = "Select Game Version";
            footer.innerHTML = `&copy; ${startYear} - ${currentYear} JR04. All rights reserved.`;
    }
}
</script>

</body>
</html>
